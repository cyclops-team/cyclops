# Cyclops high-contrast: maximum legibility, identity kept as hue.
#
# Pure white figure and saturated colors picked directly on the xterm-256
# grid so truecolor and the 256 fallback are the same color on every
# terminal (each explicit c256 below is the exact grid entry for its hex;
# the derivation confirms it, nothing is approximated). [palette] is the
# one exception: its fallbacks are the literal ANSI index, because the
# program asked for color N and terminals remap 0..15 freely.
#
# The identity survives as hue: role.1 is sage pushed to full brightness,
# role.2 is mauve pushed the same way, and the other six slots keep the
# dark theme's wheel order (blue, cyan, green, yellow, purple, pink) at
# high saturation. The alert eye is pure yellow, the strongest signal on
# black.
#
# CONTRAST. Checked pair: every token in the vocabulary against #000000.
# That ground is surface.bg, pure black: a high-contrast terminal is on
# black, and the workspace paints it under pane bodies.
# Measured as WCAG 2.1 relative luminance in sRGB, ratio
# (lighter + 0.05) / (darker + 0.05); the arithmetic is in
# src/cyclops-theme/tests/shipped.rs and every number below is pinned
# there by shipped_themes_meet_their_stated_contrast.
#
# Target 7:1, WCAG AAA for body text, and every figure token clears it.
# The floor is state.terminal and badge.terminal at 7.05:1, then role.2
# at 7.5:1 and state.dead at 7.8:1; surface.fg is 21:1. The two [chrome]
# grounds are backgrounds the workspace chrome paints, not figures, so
# their bar (pinned in the same test) is that chrome.text stays readable
# on both grounds at the same 7:1, measuring 13.2:1 on raised.
#
# surface.fg is the one value here that no renderer paints. Cyclops prints
# body text in the terminal's own foreground; the engine reads surface.fg
# only as its fallback when a renderer asks for a token outside the
# vocabulary. Editing it changes nothing on screen.
#
# [state] and [badge] are dark.toml's four groups pushed onto the same
# grid: pure green, amber, salmon red, and the two grays. Which state
# lands in which group is dark.toml's table. The reds are what sets the
# floor, because a saturated red on black is the one signal color that
# struggles to clear a high bar at all: #ff5f5f is the grid entry that
# stays unmistakably red, and it clears 7:1 with 0.05 to spare. The next
# grid red up, #ff8787 (9.1:1), has gone pink.
#
# There is no [stream] table, for the reason written out in dark.toml:
# the stream's gutter resolves surface.dim like every other detail column.
# surface.bg is the ground the workspace paints under pane bodies, black
# so a pane body reads the same as the terminal around it; one-shot
# commands still print on the terminal's own background. The [chrome]
# pair is the workspace chrome's own two grounds, both exact grid grays.
# The [palette] entries are content colors the running program picks, so
# no contrast bar applies to them; all sixteen are exact grid entries in
# truecolor even though their fallbacks are the indices.

name = "high-contrast"

[surface]
fg = { hex = "#ffffff", c256 = 231 }
bg = { hex = "#000000", c256 = 16 }
dim = { hex = "#bcbcbc", c256 = 250 }
accent = { hex = "#ffff00", c256 = 226 }

[role]
1 = { hex = "#87d75f", c256 = 113 } # sage at full brightness
2 = { hex = "#d7875f", c256 = 173 } # mauve at full brightness
3 = { hex = "#5fafff", c256 = 75 }  # blue
4 = { hex = "#5fd7d7", c256 = 80 }  # cyan
5 = { hex = "#5fd787", c256 = 78 }  # green
6 = { hex = "#d7d75f", c256 = 185 } # yellow
7 = { hex = "#af87ff", c256 = 141 } # purple
8 = { hex = "#ff87d7", c256 = 212 } # pink

[eye]
calm = { hex = "#c6c6c6", c256 = 251 }
alert = { hex = "#ffff00", c256 = 226 }

[state]
healthy = { hex = "#00d700", c256 = 40 }    # 10.7:1
needs_you = { hex = "#ffaf00", c256 = 214 } # 11.4:1
terminal = { hex = "#ff5f5f", c256 = 203 }  # 7.05:1, the floor
quiet = { hex = "#bcbcbc", c256 = 250 }     # 11.1:1, same as surface.dim
dead = { hex = "#9e9e9e", c256 = 247 }      # 7.8:1, below quiet

[badge]
healthy = { hex = "#00d700", c256 = 40 }
needs_you = { hex = "#ffaf00", c256 = 214 }
terminal = { hex = "#ff5f5f", c256 = 203 }
quiet = { hex = "#bcbcbc", c256 = 250 }

# The ANSI-16 mapping for pane content: saturated grid entries, black
# kept black because programs draw with it on their own grounds.
[palette]
0 = { hex = "#000000", c256 = 0 }
1 = { hex = "#d70000", c256 = 1 }
2 = { hex = "#00d700", c256 = 2 }
3 = { hex = "#ffaf00", c256 = 3 }
4 = { hex = "#5fafff", c256 = 4 }
5 = { hex = "#d700d7", c256 = 5 }
6 = { hex = "#00d7d7", c256 = 6 }
7 = { hex = "#d0d0d0", c256 = 7 }
8 = { hex = "#6c6c6c", c256 = 8 }
9 = { hex = "#ff5f5f", c256 = 9 }
10 = { hex = "#5fff5f", c256 = 10 }
11 = { hex = "#ffff00", c256 = 11 }
12 = { hex = "#87d7ff", c256 = 12 }
13 = { hex = "#ff5fff", c256 = 13 }
14 = { hex = "#5fffff", c256 = 14 }
15 = { hex = "#ffffff", c256 = 15 }

[chrome]
text = { hex = "#ffffff", c256 = 231 }
panel = { hex = "#121212", c256 = 233 }
raised = { hex = "#303030", c256 = 236 }
