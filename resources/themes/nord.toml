# Nord, mapped onto the cyclops vocabulary. Palette: the Nord project
# (MIT). Snow Storm carries the surface, Frost the accent and the cool
# roles, Aurora the states and the warm roles. Among the semantic roles
# one hand-tune leaves the published palette (the ANSI brights note
# their own lifts under [palette]): nord3 as surface.dim measured
# 1.36:1 on the chrome panel (the sidebar and menu-button ground),
# under the workspace's 3:1
# readability floor, and Nord has no step between Polar Night and Snow
# Storm that clears it. Dim sits between them instead: 3.22:1 on the
# panel, 4.00:1 on the pane ground. eye.calm, state.quiet and
# badge.quiet keep nord3, so quiet marks stay Nord's own comment color.
name = "nord"
[surface]
fg = { hex = "#d8dee9", c256 = 253 }
bg = { hex = "#2e3440", c256 = 237 } # nord0, the pane ground
dim = { hex = "#8892a8", c256 = 103 } # hand-tuned off nord3; see header
accent = { hex = "#88c0d0", c256 = 110 }
[role]
1 = { hex = "#88c0d0", c256 = 110 } # frost, the accent
2 = { hex = "#a3be8c", c256 = 144 } # aurora green
3 = { hex = "#81a1c1", c256 = 109 } # frost blue
4 = { hex = "#8fbcbb", c256 = 116 } # frost teal; hand-tuned away from role.3
5 = { hex = "#d08770", c256 = 173 } # aurora orange
6 = { hex = "#b48ead", c256 = 139 } # aurora purple
7 = { hex = "#ebcb8b", c256 = 222 } # aurora yellow
8 = { hex = "#5e81ac", c256 = 67 }  # frost deep blue
[eye]
calm = { hex = "#4c566a", c256 = 240 }
alert = { hex = "#88c0d0", c256 = 110 }
[state]
healthy = { hex = "#a3be8c", c256 = 144 }
needs_you = { hex = "#ebcb8b", c256 = 222 }
terminal = { hex = "#bf616a", c256 = 131 }
quiet = { hex = "#4c566a", c256 = 240 }
dead = { hex = "#3b4252", c256 = 238 }
[badge]
healthy = { hex = "#a3be8c", c256 = 144 }
needs_you = { hex = "#ebcb8b", c256 = 222 }
terminal = { hex = "#bf616a", c256 = 131 }
quiet = { hex = "#4c566a", c256 = 240 }

# The ANSI-16 mapping: Nord's published terminal scheme. Nord repeats
# entries 9..13 verbatim; here they are lifted toward white so all
# sixteen stay pairwise distinct. Fallbacks are the literal ANSI index.
[palette]
0 = { hex = "#3b4252", c256 = 0 }  # nord1
1 = { hex = "#bf616a", c256 = 1 }
2 = { hex = "#a3be8c", c256 = 2 }
3 = { hex = "#ebcb8b", c256 = 3 }
4 = { hex = "#81a1c1", c256 = 4 }
5 = { hex = "#b48ead", c256 = 5 }
6 = { hex = "#88c0d0", c256 = 6 }
7 = { hex = "#e5e9f0", c256 = 7 }  # nord5
8 = { hex = "#4c566a", c256 = 8 }  # nord3
9 = { hex = "#c7747c", c256 = 9 }
10 = { hex = "#aec69a", c256 = 10 }
11 = { hex = "#edd199", c256 = 11 }
12 = { hex = "#90acc8", c256 = 12 }
13 = { hex = "#bd9cb7", c256 = 13 }
14 = { hex = "#8fbcbb", c256 = 14 } # nord7
15 = { hex = "#eceff4", c256 = 15 } # nord6

# The workspace chrome's grounds: Nord's polar-night steps nord1/nord2.
[chrome]
text = { hex = "#d8dee9", c256 = 253 }
panel = { hex = "#3b4252", c256 = 238 }
raised = { hex = "#434c5e", c256 = 239 }
