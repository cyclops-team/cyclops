# Cyclops blossom: a light theme drawn on petal paper. The ground is a
# warm pink-white, the chrome darkens into rose instead of gray, and the
# accent is a deep rose, the one ink on this page trusted to carry
# meaning on its own.
#
# The eight role slots are a bouquet rather than a pink family: rose,
# plum, violet, periwinkle, teal, moss, amber, terracotta. Pink is the
# theme's voice, but two agents have to be told apart across a room, so
# the wheel stays open instead of crowding into the magenta corner.
# Every ink here was measured against this ground; none of it is a dark
# theme lightened.
#
# The eye follows the shipped light theme's logic: calm takes
# surface.dim so a quiet rig recedes, alert takes the rose accent.
#
# [state] and [badge] are the same four groups, redundant with the glyph
# and the word: a leaf green, a copper amber, a rose red, quiet on
# surface.dim, and dead ABOVE dim, because on paper a lighter gray is
# the quieter one. Which state lands in which group is dark.toml's
# table; nothing about the grouping changes per theme.
#
# There is no [stream] table, for the reason written out in dark.toml:
# the stream's gutter resolves surface.dim like every other detail
# column.
#
# Two hand-tunes, both about the ground:
#
#   chrome.raised is deepened past a mechanical second step down from
#   the panel. On a ground this pale, the mirror step left the selected
#   row nearly flat against the panel behind it.
#
#   role.8 terracotta sits a shade darker than the rest of the wheel so
#   its 256-color entry does not collapse onto role.1's rose. Role color
#   is one of the two meaning-carrying encodings, so no two roles may
#   share an entry.
#
# Every 256-color fallback is explicit, and outside [palette] each is
# exactly what the cyclops-theme derivation picks, role slots included:
# the wheel was chosen at lightnesses where no two roles land on the
# same entry, so nothing here overrides the algorithm. The [palette]
# fallbacks are the literal ANSI index: the program asked for color N,
# and terminals remap 0..15 freely.

name = "blossom"

[surface]
fg = { hex = "#3a2a30", c256 = 236 }
bg = { hex = "#fdf6f8", c256 = 231 }
dim = { hex = "#7a636b", c256 = 242 }
accent = { hex = "#b03a5e", c256 = 131 }

[role]
1 = { hex = "#b03a5e", c256 = 131 } # rose, the accent
2 = { hex = "#964a90", c256 = 96 }  # plum
3 = { hex = "#8151ab", c256 = 97 }  # violet
4 = { hex = "#5d5db3", c256 = 61 }  # periwinkle
5 = { hex = "#2d6e86", c256 = 24 }  # teal
6 = { hex = "#3f745a", c256 = 65 }  # moss, grayed off the state green
7 = { hex = "#856021", c256 = 94 }  # amber
8 = { hex = "#a34a2f", c256 = 130 } # terracotta, see the header

[eye]
calm = { hex = "#7a636b", c256 = 242 }
alert = { hex = "#b03a5e", c256 = 131 }

[state]
healthy = { hex = "#24743f", c256 = 29 }   # leaf green
needs_you = { hex = "#8e5721", c256 = 94 } # copper amber
terminal = { hex = "#b13848", c256 = 131 } # rose red
quiet = { hex = "#7a636b", c256 = 242 }    # same as surface.dim
dead = { hex = "#a48f9a", c256 = 247 }     # above dim: lighter is quieter here

[badge]
healthy = { hex = "#24743f", c256 = 29 }
needs_you = { hex = "#8e5721", c256 = 94 }
terminal = { hex = "#b13848", c256 = 131 }
quiet = { hex = "#7a636b", c256 = 242 }

# The ANSI-16 mapping for pane content, at ink strength so every entry
# reads on this ground: an agent printing in red, green or yellow stays
# legible on the pane it was given. 0 is the page's own ink, and the
# three grays keep the standard ladder, 0 darkest, then 8, then 7, then
# 15. The brights are the normals' hues lifted, not a second family.
[palette]
0 = { hex = "#3a2a30", c256 = 0 }
1 = { hex = "#b13848", c256 = 1 }
2 = { hex = "#24743f", c256 = 2 }
3 = { hex = "#8e5721", c256 = 3 }
4 = { hex = "#3e6598", c256 = 4 }
5 = { hex = "#9c408a", c256 = 5 }
6 = { hex = "#296c7a", c256 = 6 }
7 = { hex = "#897881", c256 = 7 }
8 = { hex = "#796a71", c256 = 8 }
9 = { hex = "#d24d56", c256 = 9 }
10 = { hex = "#238c4a", c256 = 10 }
11 = { hex = "#9f731a", c256 = 11 }
12 = { hex = "#447cc4", c256 = 12 }
13 = { hex = "#c549ad", c256 = 13 }
14 = { hex = "#268699", c256 = 14 }
15 = { hex = "#988890", c256 = 15 }

# The workspace chrome's grounds, both darker than the page: on a light
# theme the chrome recedes by darkening, and both hold the ground's pink
# rather than falling back to neutral gray.
[chrome]
text = { hex = "#3a2a30", c256 = 236 }
panel = { hex = "#f6e9ee", c256 = 255 }
raised = { hex = "#e3cbd6", c256 = 188 }
