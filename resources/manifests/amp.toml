# Cyclops detection manifest: Amp (Sourcegraph)
# UNVERIFIED best effort from primary documentation. No Amp binary was
# available on the evidence host. Sources:
#   https://ampcode.com/docs/cli/settings       ~/.config/amp/settings.json, AMP_SETTINGS_FILE
#   https://ampcode.com/docs/customize/skills   ~/.config/agents/skills, ~/.agents/skills, ~/.config/amp/skills
#   https://ampcode.com/docs/customize/plugins  TypeScript plugin API (agent.start, agent.end, tool.call)
#   https://ampcode.com/manual                  amp.hooks: declarative on/action entries
#
# NO SHELL HOOK. Amp's documented extension surfaces are a TypeScript plugin
# API (code loaded from .amp/plugins/ or ~/.config/amp/plugins/) and an
# `amp.hooks` settings array whose actions are fixed types such as
# send-user-message and redact-tool-input, not user commands. Neither can
# run `cyclops hook`, so this manifest binds the pane and the skill is
# seeded; hooks are a follow-up that needs a live Amp.
#
# Sensor summary for this CLI:
#   process  Amp is an npm package run by Node, so #{pane_current_command}
#            is expected to read "node" and argv[0] "node" (MEASURED for
#            gemini, inferred here). "node" is not listed: it would claim
#            every Node process. Until the daemon reads the script path
#            behind an interpreter, pin the pane:
#            cyclops name %N <label> --manifest amp.
#   title    UNMEASURED.
#   screen   UNMEASURED. No idle or working rule ships, so deliveries fail
#            closed (not write-ready) until someone measures the composer.

[agent]
id = "amp"
display_name = "Amp"
version_tested = "unverified"
process_names = ["amp"]
argv_basenames = ["amp"]
launch = "amp"

[hooks]
config_mechanism = "none: amp.hooks actions are fixed types and plugins are TypeScript"

[[rule]]
id = "title_useless"
state = "unknown"
priority = 0
region = "pane_title"
note = "No title measurement exists for Amp."
evidence = "UNMEASURED"

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
verify_pattern = ["<message_id>"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
