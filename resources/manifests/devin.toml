# Cyclops detection manifest: Devin for Terminal (Cognition)
# UNVERIFIED best effort from primary documentation, written 2026-09-04.
# No devin binary was run and nothing was measured: this file binds the
# pane and declares the documented hook contract and nothing more. Sources:
#   https://docs.devin.ai/cli/extensibility/hooks/overview
#   https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks
#   https://docs.devin.ai/cli/essential-commands
#   https://devin.ai/cli
#
# Skills directory (skills.sh catalog key devin): ~/.config/devin/skills
# ($XDG_CONFIG_HOME/devin/skills)
#
# Sensor summary for this CLI:
#   process  devin is a native install (curl cli.devin.ai/install.sh or the
#            devin-cli Homebrew cask), so #{pane_current_command} is expected
#            to read "devin" (inferred, not measured).
#   title    UNMEASURED.
#   hooks    DOCUMENTED, Claude-shaped: a `hooks` object in
#            ~/.config/devin/config.json (user) or .devin/config.json, or the
#            standalone .devin/hooks.v1.json where the hooks object is the
#            whole file; the .claude/settings*.json family is read too and
#            Cyclops never writes it. JSON on stdin, exit 2 blocks.
#            UserPromptSubmit carries `prompt`, so it is the dispatch
#            candidate and the ACK field. Every payload after the first
#            prompt carries a per-turn prompt_id "rotated on every user
#            prompt", shared by UserPromptSubmit and Stop: a turn-key
#            candidate for a follow-up once a settle window is measured.
#            Until then no end is declared (Stop can re-fire,
#            stop_hook_active) and Stop is wired for liveness only. There is
#            no Notification event; PermissionRequest is the attention edge.
#   screen   UNMEASURED. The docs quote no prompt string (Shift+Tab cycles
#            modes, Esc cancels), so no idle rule ships and deliveries fail
#            closed (not write-ready).

[agent]
id = "devin"
display_name = "Devin for Terminal"
version_tested = "unverified"
process_names = ["devin"]
argv_basenames = ["devin"]
launch = "devin"

[hooks]
config_mechanism = "hooks object in ~/.config/devin/config.json"
turn_start = "UserPromptSubmit"
turn_start_evidence = "candidate"
ack = "UserPromptSubmit"
ack_payload_field = "prompt"
ack_evidence = "dispatch"
attention = "PermissionRequest"
available = [
  "PreToolUse", "PostToolUse", "PermissionRequest", "UserPromptSubmit", "Stop",
  "PostCompaction", "SessionStart", "SessionEnd",
]

[hooks.wiring]
shape = "claude-settings"
file = "~/.config/devin/config.json"
payload_prompt_field = "prompt"

[hooks.wiring.events]
session_start = "SessionStart"
prompt_submit = "UserPromptSubmit"
stop = "Stop"
permission_request = "PermissionRequest"

[[rule]]
id = "title_useless"
state = "unknown"
priority = 0
region = "pane_title"
note = "No title measurement exists for Devin for Terminal."
evidence = "UNMEASURED"

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
verify_pattern = ["<message_id>"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
