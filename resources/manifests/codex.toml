# Cyclops detection manifest: OpenAI Codex CLI
# Derived from MEASURED evidence in validation/raw/p0 and validation/raw/soak.
# Verified against codex-cli 0.145.0 inside tmux 3.6a, 120x40 pane;
# re-verified on 0.147.0 (live rig, 2026-08-08) when screen_working was found
# shadowed by the composer rules. The spinner reads "• Working (0s • esc to
# interrupt)" and the ghost composer stays on screen for the whole turn.
#
# Sensor summary for this CLI:
#   title  USELESS. #{pane_title} is the static project directory name in
#          220/220 samples taken during active turns. There is no title tier
#          for Codex, unlike Claude. This asymmetry is why the fusion layer
#          must be per-agent data, not one fleet-wide ladder.
#   hooks  AUTHORITATIVE for turn edges and ACK, but see [hooks].gating below:
#          project-local hooks silently do not load in an untrusted directory.
#   screen REQUIRED for busy/idle, since the title carries nothing.

[agent]
id = "codex"
display_name = "Codex CLI"
version_tested = "0.147.0"
process_names = ["codex"]
# What `cyclops start --agents codex` runs in a pane. The bare CLI, so the
# directory-trust gate in [hooks] below still applies to a pane started
# this way: hooks are `cyclops hooks install`, never composed in here.
launch = "codex"

[hooks]
# Event names are PascalCase in hooks.json, snake_case internally.
config_mechanism = "hooks.json in CODEX_HOME or <repo>/.codex/"
turn_start = "UserPromptSubmit"
turn_end = "Stop"
ack = "UserPromptSubmit"
available = [
  "SessionStart", "SessionEnd", "UserPromptSubmit", "Stop", "PreToolUse",
  "PostToolUse", "PermissionRequest", "PreCompact", "PostCompact",
  "SubagentStart", "SubagentStop",
]
ack_payload_field = "prompt"
ack_latency_ms_p50 = 30.4
ack_latency_ms_p95 = 34.8
legacy_notify = "agent-turn-complete"   # notify program; payload has last-assistant-message, no cwd

gating = """CRITICAL DEPLOYMENT FACT, MEASURED. Project-local .codex/hooks.json does
NOT load until the working directory is trusted. The trust decision is an
interactive dialog ('Do you trust the contents of this directory?'). In
non-interactive `codex exec` the dialog cannot be answered, so hooks silently
never fire and every turn looks unacknowledged. --dangerously-bypass-hook-trust
does NOT solve this: it bypasses hook-definition trust, not directory trust.
Working configuration: put hooks in a CODEX_HOME-scoped user-level hooks.json,
or pre-seed projects."<path>".trust_level = "trusted" in config.toml.
Evidence: 4 consecutive exec runs fired zero hooks until CODEX_HOME was used."""

duplicate_warning = """User-level and project-level hooks BOTH load and BOTH fire
when the directory is trusted, producing duplicate events for the same edge.
The daemon must dedupe on (session_id, turn_id)."""

# ---------------------------------------------------------------------------
# Screen rules. No title tier exists for this CLI.
# ---------------------------------------------------------------------------

# The plain capture cannot separate ghost suggestions from typed text: both
# render as '› <text>'. MEASURED (ghost probe, codex-cli 0.146.0, fixtures in
# src/cyclops-manifest/tests/fixtures/codex_*): the escaped capture can.
# The composer glyph renders bold (ESC[1m › ESC[0m); ghost text after it is
# wrapped in dim (ESC[2m ... ESC[0m) while typed text is bare. The two rules
# below carry that discriminator as line_regex_esc clauses, which only fire
# on a capture-pane -e capture; the daemon supplies one wherever a bound
# manifest carries esc rules. Without one they fail closed and
# composer_empty_or_ghost remains the (idle-biased) fallback.

[[rule]]
id = "composer_typed_input"
state = "idle_with_input"
priority = 1050
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^\s*(?:\x1b\[[0-9;]*m)*›(?:\x1b\[[0-9;]*m)*\s+[^\x1b\s]']
note = """Typed (or staged) text after the composer glyph is NOT dim: the first
significant character after '› ' is a plain byte, not an SGR introducer. Do not
inject: would concatenate with the human's draft. Human live typing wins."""
evidence = "MEASURED ghost probe: 'ESC[1m›ESC[0m fix the rate limiter in gateway.rs'"

[[rule]]
id = "composer_ghost_suggestion"
state = "idle"
priority = 1040
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^\s*(?:\x1b\[[0-9;]*m)*›(?:\x1b\[[0-9;]*m)*\s+\x1b\[2m']
note = """Ghost suggestion text is wrapped in SGR dim (ESC[2m) directly after
the glyph. Ghost text is NOT staged user input; the pane is idle and safe."""
evidence = "MEASURED ghost probe: 'ESC[1m›ESC[0m ESC[2mFind and fix a bug in @filenameESC[0m'"

[[rule]]
id = "composer_empty_or_ghost"
state = "idle"
priority = 1000
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*›']
note = """The composer line renders ghost-text suggestions such as
'› Write tests for @filename' when empty. Ghost text is NOT staged user input.
This is the same trap cyclops v1 hardcoded an allowlist for (bin/commPact:678-683);
matching the glyph rather than emptiness avoids needing that allowlist.
FALLBACK ONLY: on a plain capture this rule also matches typed text and reads
it as idle. The esc rules above outrank it whenever an escaped capture is
available, and the daemon feeds one wherever the bound manifest carries esc
rules, so this fallback only decides when the escaped sensor is absent."""
evidence = "MEASURED: observed live during soak startup"

[[rule]]
id = "screen_working"
state = "working"
priority = 1100
region = "bottom_non_empty_lines(8)"
any = [
  { contains = ["esc to interrupt"] },
  { line_regex = ['^\s*•\s+(?:Working|Thinking)\b'] },
]
note = """This rule MUST outrank the composer rules. MEASURED: Codex keeps the
ghost composer line on screen for the whole turn, so composer_ghost_suggestion
and composer_empty_or_ghost match continuously while the agent generates. At
the old priority of 800 they both won, every turn read idle, and because idle
is in [injection].safe_states the gate would paste into a live generation.
cursor.toml was written against this exact defect and ordered itself the other
way; this manifest never got the same fix.

Two MEASURED signals, matching how cursor.toml separates them. The primary is
the interrupt hint, present for exactly the duration of the turn. It is
lowercase on the wire: the previous clause spelled it 'Esc to interrupt' and
`contains` is case-sensitive, so that clause could never fire.

The second is the spinner line '• Working (0s • esc to interrupt)'. The bullet
prefix is required by the regex because U+2022 also prefixes the agent's own
response text, so a bare `contains = ["Working"]` would read the agent's
prose as a live turn. That looseness was survivable at 800, where the rule lost
to everything above it; at 1100 it would wedge a finished pane as working."""
evidence = "MEASURED 2026-08-08, codex-cli 0.147.0, fixtures/codex_working_composer_plain.txt; captured live at 120x40 while the turn rendered"

[[rule]]
id = "trust_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(14)"
contains = ["Do you trust the contents of this directory"]
note = "Blocks all hook loading until answered. Options: 1 = Yes, 2 = No/quit."
evidence = "MEASURED p0_ack_codex first launch"
# Trust is a security decision the daemon never makes on its own.
auto_dismiss = false

[[rule]]
id = "update_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(14)"
contains = ["Update available"]
note = """HIGHEST-SEVERITY INJECTION HAZARD FOUND IN THIS CAMPAIGN. The dialog reads
'Press enter to continue' with option 1 preselected as
'Update now (runs `brew upgrade --cask codex`)'. A blind Enter from a delivery
pipeline triggers a package upgrade of the agent binary mid-session. Decline
explicitly with '3' (Skip until next version), never Escape-then-Enter and never
a bare Enter."""
evidence = "MEASURED live during soak startup, validation/raw/soak/codex_modals.log"
decline_keys = ["3", "Enter"]
auto_dismiss = true

[[rule]]
id = "approval_prompt"
state = "blocked_permission"
priority = 1200
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["Allow command"] },
  { line_regex = ['^\s*›?\s*1\.\s+Yes'] },
]
evidence = "INFERRED from approval_policy=untrusted config surface; not reproduced in the measured window"
# An approval decision belongs to the human. Park the delivery and alert.
auto_dismiss = false

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
# The composer collapses a long paste into a "[Pasted Content N chars]"
# chip, hiding the message id — so for long messages the "Pasted" pattern
# on the composer line is the ONLY verifiable staging evidence, and the
# composer line is only recognizable in an escaped capture (the esc rules
# above). The daemon takes the escaped verify capture because this
# manifest carries esc clauses; without that pairing every long delivery
# read verify_failed and was left staged, unsubmitted (observed in the
# field, 2026-08-17).
verify_pattern = ["<message_id>", "Pasted"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
