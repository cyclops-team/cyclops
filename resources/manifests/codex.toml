# Cyclops detection manifest: OpenAI Codex CLI
# Derived from MEASURED evidence in validation/raw/p0 and validation/raw/soak.
# Verified against codex-cli 0.145.0 inside tmux 3.6a, 120x40 pane;
# re-verified on 0.147.0 (live rig, 2026-08-08) when screen_working was found
# shadowed by the composer rules. The spinner reads "• Working (0s • esc to
# interrupt)" and the ghost composer stays on screen for the whole turn.
# Composer extraction and clear action were re-measured on 0.149.0
# (2026-08-21). Active and idle pane titles were re-measured on 0.149.0
# (2026-08-22). Occupied prompt styling and no-color trailer structure were
# re-measured on 0.149.1 (2026-08-25).
#
# Sensor summary for this CLI:
#   title  WORKING-ONLY on 0.149.0. Active turns prefix the project title with
#          a measured ten-frame Braille spinner; idle titles have no prefix.
#          Older measured versions kept a static project title, so they fall
#          through to screen evidence.
#   hooks  AUTHORITATIVE for turn edges and ACK, but see [hooks].gating below:
#          project-local hooks silently do not load in an untrusted directory.
#   screen REQUIRED as the working fallback and for idle/input/modal state.

[agent]
id = "codex"
display_name = "Codex CLI"
version_tested = "0.147.0"
process_names = ["codex"]
# What `cyclops start --agents codex` runs in a pane. The bare CLI, so the
# directory-trust gate in [hooks] below still applies to a pane started
# this way: hooks are `cyclops hooks install`, never composed in here.
launch = "codex"

[messaging]
mailbox_capability_file = "~/.agents/skills/cyclops/SKILL.md"

[hooks]
# Event names are PascalCase in hooks.json, snake_case internally.
config_mechanism = "hooks.json in CODEX_HOME or <repo>/.codex/"
turn_start = "UserPromptSubmit"
turn_start_evidence = "confirmed"
turn_end = "Stop"
turn_end_evidence = "confirmed"
ack = "UserPromptSubmit"
# Fields that together identify ONE turn, in order. A start and an end
# carrying the same values are the same turn, which is what lets a
# composer lock wait for the end of the turn it is actually holding
# rather than for any end at all.
#
# VERIFIED against the tagged release, not a captured fixture. In
# codex rust-v0.149.0 both UserPromptSubmitRequest and StopRequest carry
# a string session_id and a string turn_id, and both serializers emit
# both fields:
#   codex-rs/hooks/src/events/user_prompt_submit.rs
#   codex-rs/hooks/src/events/stop.rs
# Only this vendor is verified. A vendor whose start and end share no
# per-turn field declares nothing here and runs on screen evidence.
turn_key_fields = ["session_id", "turn_id"]
available = [
  "SessionStart", "SessionEnd", "UserPromptSubmit", "Stop", "PreToolUse",
  "PostToolUse", "PermissionRequest", "PreCompact", "PostCompact",
  "SubagentStart", "SubagentStop",
]
ack_payload_field = "prompt"
ack_latency_ms_p50 = 30.4
ack_latency_ms_p95 = 34.8
legacy_notify = "agent-turn-complete"   # notify program; payload has last-assistant-message, no cwd

gating = """CRITICAL DEPLOYMENT FACT, MEASURED. Project-local .codex/hooks.json does
NOT load until the working directory is trusted. The trust decision is an
interactive dialog ('Do you trust the contents of this directory?'). In
non-interactive `codex exec` the dialog cannot be answered, so hooks silently
never fire and every turn looks unacknowledged. --dangerously-bypass-hook-trust
does NOT solve this: it bypasses hook-definition trust, not directory trust.
Working configuration: put hooks in a CODEX_HOME-scoped user-level hooks.json,
or pre-seed projects."<path>".trust_level = "trusted" in config.toml.
Evidence: 4 consecutive exec runs fired zero hooks until CODEX_HOME was used."""

duplicate_warning = """User-level and project-level hooks BOTH load and BOTH fire
when the directory is trusted, producing duplicate events for the same edge.
The daemon must dedupe on (session_id, turn_id)."""

# ---------------------------------------------------------------------------
# Detection rules. The current title tier wins when its measured spinner is
# present; screen rules remain the fallback and carry every non-title state.
# ---------------------------------------------------------------------------

# The plain capture cannot separate ghost suggestions from typed text: both
# render as '› <text>'. MEASURED (ghost probe, codex-cli 0.146.0, fixtures in
# src/cyclops-manifest/tests/fixtures/codex_*): the escaped capture can.
# The composer glyph renders bold (ESC[1m › ESC[0m); ghost text after it is
# wrapped in dim (ESC[2m ... ESC[0m) while typed text is bare. The two rules
# below carry that discriminator as line_regex_esc clauses, which only fire
# on a capture-pane -e capture; the daemon supplies one wherever a bound
# manifest carries esc rules. Without one they fail closed and
# composer_empty_or_ghost remains the (idle-biased) fallback.

[[rule]]
id = "composer_typed_input"
state = "idle_with_input"
composer_semantic = "human_input"
priority = 1050
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^\s*\x1b\[1m(?:\x1b\[(?:3[0-7]|38(?:(?:;|:)[0-9]+)+)m)*›(?:\x1b\[[0-9;:]*m)*\s+(?:[^\x1b\s]|\x1b\[(?:[013-9][0-9;:]*|2[0-9;:]+)m)']
note = """Content after the composer glyph, in either form it takes. Typed text
is a plain byte ('› fix the rate limiter'). A paste long enough to collapse is
a COLORED chip ('› [Pasted Content 2828 chars]' in 38;5;6), so its first
significant character is an SGR introducer, not a byte — the earlier
`[^\\x1b\\s]` clause could not see it, and a staged chip read idle: the gate
would paste a second message on top of the first, and delivery could not
verify its own staging (both fixed 2026-08-17). Codex 0.149.1 adds a
truecolor foreground SGR between the bold-only run and the glyph. The optional
run before the glyph accepts only measured foreground-color forms, not dim.

Two exclusions carry the rule. Ghost suggestions are dim, so an SGR whose
whole parameter list is `2` is not content — that is what the alternation's
second branch spells out. And the glyph is pinned to BOLD-ONLY (`ESC[1m›`):
the transcript renders past turns with a bold-DIM glyph (`ESC[1;2m›`), and a
looser glyph run matched those too, which would let transcript residue read
as a live composer. Claude solves the same collapse in
claude.toml/composer_has_staged_input; codex never got the treatment."""
evidence = """MEASURED 2026-08-17, codex-cli 0.147.0, live pane at 120x40,
fixtures/codex_pasted_chip_{esc,plain}.txt:
  composer + chip   ESC[1m›ESC[0m ESC[38;5;6m[Pasted Content 2828 chars]ESC[39m
  composer + ghost  ESC[1m›ESC[0m ESC[2mSummarize recent commitsESC[0m
  transcript        ESC[1;2m›  ESC[0m[cyclops m-diag01] FROM: tester ...
MEASURED 2026-08-25, codex-cli 0.149.1, live 187x62 pane:
  composer          ESC[1m ESC[38;2;255;178;66m › ESC[0m <typed text>
Earlier ghost probe (0.146.0): 'ESC[1m›ESC[0m fix the rate limiter in gateway.rs'"""

[[rule]]
id = "composer_ghost_suggestion"
state = "idle"
composer_semantic = "ghost_suggestion"
priority = 1040
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^\s*\x1b\[1m(?:\x1b\[(?:3[0-7]|38(?:(?:;|:)[0-9]+)+)m)*›(?:\x1b\[[0-9;:]*m)*\s+\x1b\[2m']
note = """Ghost suggestion text is wrapped in SGR dim (ESC[2m) directly after
the glyph. The prompt itself may carry the measured 0.149.1 foreground color.
Ghost text is NOT staged user input; the pane is idle and safe."""
evidence = "MEASURED ghost probe: 'ESC[1m›ESC[0m ESC[2mFind and fix a bug in @filenameESC[0m'"

[[rule]]
id = "composer_empty_or_ghost"
state = "idle"
composer_semantic = "ambiguous"
priority = 1000
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*›']
note = """The composer line renders ghost-text suggestions such as
'› Write tests for @filename' when empty. Ghost text is NOT staged user input.
This is the same trap cyclops v1 hardcoded an allowlist for (bin/commPact:678-683);
matching the glyph rather than emptiness avoids needing that allowlist.
FALLBACK ONLY: on a plain capture this rule also matches typed text and reads
it as idle. The esc rules above outrank it whenever an escaped capture is
available, and the daemon feeds one wherever the bound manifest carries esc
rules, so this fallback only decides when the escaped sensor is absent."""
evidence = "MEASURED: observed live during soak startup"

[[rule]]
id = "title_working_spinner"
state = "working"
priority = 1110
region = "pane_title"
line_regex = ['^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] \S.*$']
note = """Codex 0.149.0 prefixes the active pane title with its exact ten-frame
Braille spinner cycle. The idle title is the project name with no prefix. This
title rule keeps working detection independent of queued terminal input below
the on-screen spinner. Older static titles fall through to the screen rule."""
evidence = "MEASURED 2026-08-22, codex-cli 0.149.0: all ten active title frames across 20 samples; same-version idle title had no prefix"

[[rule]]
id = "screen_working"
state = "working"
priority = 1100
region = "bottom_non_empty_lines(8)"
any = [
  { contains = ["esc to interrupt"] },
  { line_regex = ['^\s*•\s+(?:Working|Thinking)\b'] },
]
note = """This rule MUST outrank the composer rules. MEASURED: Codex keeps the
ghost composer line on screen for the whole turn, so composer_ghost_suggestion
and composer_empty_or_ghost match continuously while the agent generates. At
the old priority of 800 they both won, every turn read idle, and because idle
is in [injection].safe_states the gate would paste into a live generation.
cursor.toml was written against this exact defect and ordered itself the other
way; this manifest never got the same fix.

Two MEASURED signals, matching how cursor.toml separates them. The primary is
the interrupt hint, present for exactly the duration of the turn. It is
lowercase on the wire: the previous clause spelled it 'Esc to interrupt' and
`contains` is case-sensitive, so that clause could never fire.

The second is the spinner line '• Working (0s • esc to interrupt)'. The bullet
prefix is required by the regex because U+2022 also prefixes the agent's own
response text, so a bare `contains = ["Working"]` would read the agent's
prose as a live turn. That looseness was survivable at 800, where the rule lost
to everything above it; at 1100 it would wedge a finished pane as working."""
evidence = "MEASURED 2026-08-08, codex-cli 0.147.0, fixtures/codex_working_composer_plain.txt; captured live at 120x40 while the turn rendered"

[[rule]]
id = "approval_cancelled_terminal"
state = "idle"
composer_semantic = "ghost_suggestion"
lifecycle_evidence = true
priority = 1090
region = "bottom_non_empty_lines(12)"
contains = ["Conversation interrupted - tell the model what to do differently"]
line_regex_esc = ['^\s*\x1b\[1m(?:\x1b\[(?:3[0-7]|38(?:(?:;|:)[0-9]+)+)m)*›(?:\x1b\[[0-9;:]*m)*\s+\x1b\[2m']
note = """Codex 0.149.1 does not emit Stop when the human cancels a command
approval. The exact interruption suffix plus the current dim ghost composer is
the measured terminal observation for that turn. The rule stays below
screen_working, so a later live turn wins, and its escaped composer clause
fails on typed text. A stable capture may therefore end the otherwise stranded
UserPromptSubmit latch without making the pane write-ready over human input."""
evidence = "MEASURED 2026-08-26, codex-cli 0.149.1, live resumed pane after canceling an explicit command approval"

[[rule]]
id = "trust_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(14)"
contains = ["Do you trust the contents of this directory"]
note = "Blocks all hook loading until answered. Options: 1 = Yes, 2 = No/quit."
evidence = "MEASURED p0_ack_codex first launch"
# Trust is a security decision the daemon never makes on its own.
auto_dismiss = false

[[rule]]
id = "update_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(14)"
contains = ["Update available"]
note = """HIGHEST-SEVERITY INJECTION HAZARD FOUND IN THIS CAMPAIGN. The dialog reads
'Press enter to continue' with option 1 preselected as
'Update now (runs `brew upgrade --cask codex`)'. A blind Enter from a delivery
pipeline triggers a package upgrade of the agent binary mid-session. Decline
explicitly with '3' (Skip until next version), never Escape-then-Enter and never
a bare Enter."""
evidence = "MEASURED live during soak startup, validation/raw/soak/codex_modals.log"
decline_keys = ["3", "Enter"]
auto_dismiss = true

[[rule]]
id = "approval_prompt"
state = "blocked_permission"
priority = 1200
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["Allow command"] },
  { line_regex = ['^\s*›?\s*1\.\s+Yes'] },
]
evidence = "INFERRED from approval_policy=untrusted config surface; not reproduced in the measured window"
# An approval decision belongs to the human. Park the delivery and alert.
auto_dismiss = false

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
# MEASURED 2026-08-21, Codex CLI 0.149.0: one C-c clears the whole raw
# multiline composer and a 92-line collapsed chip without submitting or
# exiting. C-e C-u cleared only the final logical line.
clear_keys = ["C-c"]
verify_before_submit = true
# The composer collapses a long paste into a "[Pasted Content N chars]"
# chip, hiding the message id — so for long messages the "Pasted" pattern
# on the composer line is the ONLY verifiable staging evidence, and the
# composer line is only recognizable in an escaped capture (the esc rules
# above). The daemon takes the escaped verify capture because this
# manifest carries esc clauses; without that pairing every long delivery
# read verify_failed and was left staged, unsubmitted (observed in the
# field, 2026-08-17).
verify_pattern = ["<message_id>", "Pasted"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]

# MEASURED (fixtures codex_pasted_chip_plain.txt and codex_pasted_chip_esc.txt,
# rows 37 and 38 of the same capture, plus a live 2026-08-20 capture): a
# blank row, then one model status row painted in truecolor.
# The two lists are one layout: entry i is row i, plain and escaped.
#
# The blank row is declared, not filtered. It is a row codex paints, so
# leaving it out made a raw-wrapped sentinel refuse on this vendor: the
# suffix began with a row the layout did not describe. Dropping blank
# rows instead would have been worse, because an undeclared blank after
# the sentinel is exactly how a truncated capture looks.
# Codex 0.149.1 appends the measured `fast` service-tier token after the
# reasoning level, so the status prefix may contain two words after the
# model name (`gpt-5.6-sol high fast`) before the first separator.
composer_trailer_regex = [
  '^\s*$',
  '^\s{0,4}gpt-\S+(?: \S+){0,2}(?: · [^·]+)+\s*$',
]
composer_trailer_regex_esc = [
  '^(?:\x1b\[[0-9;:]*m)*\s*$',
  '^(?:\x1b\[[0-9;:]*m)*\s*\x1b\[38;2;\d+;\d+;\d+mgpt-',
]
# Required prefix length: 2. Both rows are painted every time.
composer_trailer_required_prefix = 2
# Codex 0.149.1 honors NO_COLOR for the status row while retaining the
# bold composer glyph. The required blank plus status-row structure is the
# measured fallback when the trailer itself carries no SGR.
unstyled_composer_proof = "structural_trailer"
# The collapsed-paste chip, as a whole composer row. MEASURED (fixture
# codex_pasted_chip_esc.txt): the bold composer glyph, then the chip
# painted in 38;5;6.
composer_chip_regex = ['^\s*›\s+\[Pasted Content \d+ chars\]\s*$']
composer_chip_regex_esc = ['\x1b\[1m›\x1b\[0m(?:\x1b\[[0-9;:]*m)*\s*\x1b\[38;5;\d+m\[Pasted Content \d+ chars\](?:\x1b\[39m)?']
composer_prompt_regex = '^› (?P<content>.*)$'
composer_continuation_regex = '^  (?P<content>.*)$'
# The second pattern is anchored on the model-name shape rather than on
# "N K window", because a generic status-row shape cannot be separated from
# ordinary prose: 'context · budget · 128K window' is structurally identical
# to the real row. Anchoring costs coverage when the model family is renamed,
# and that failure is closed: the sentinel simply stops verifying on this
# lane and delivery falls back to the chip evidence it used before.
