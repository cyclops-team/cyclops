# Cyclops detection manifest: Kode (shareAI-lab)
# UNVERIFIED best effort from primary documentation, written 2026-09-04.
# No kode binary was run and nothing was measured: this file binds the pane
# and nothing more. Sources:
#   https://github.com/shareAI-lab/Kode-CLI
#   https://www.npmjs.com/package/@shareai-lab/kode
#
# Skills directory (skills.sh catalog key kode): ~/.kode/skills
#
# NO HOOK CONFIG. Kode documents ~/.kode.json, ~/.kode/ ($KODE_CONFIG_DIR)
# and project .kode/settings.json, but no shell-command lifecycle hook, so
# no [hooks] table and no wiring ships. This manifest binds the pane so the
# agent's own `cyclops send` resolves its identity, and the skill is seeded.
#
# Sensor summary for this CLI:
#   process  kode is an npm package run by Node, so #{pane_current_command}
#            is expected to read "node" (MEASURED for gemini, inferred here).
#            "node" is not listed: it would claim every Node process. Pin
#            the pane: cyclops name %N <label> --manifest kode.
#   title    UNMEASURED.
#   screen   UNMEASURED. The docs quote no prompt string (only a
#            /statusline command), so no idle rule ships and deliveries fail
#            closed (not write-ready).

[agent]
id = "kode"
display_name = "Kode"
version_tested = "unverified"
process_names = ["kode", "kwa", "kd"]
argv_basenames = ["kode", "kwa", "kd"]
launch = "kode"

[[rule]]
id = "title_useless"
state = "unknown"
priority = 0
region = "pane_title"
note = "No title measurement exists for Kode."
evidence = "UNMEASURED"

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
verify_pattern = ["<message_id>"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
