# Cyclops detection manifest: Claude Code
# Derived from MEASURED evidence in validation/raw/p0 and validation/raw/soak.
# Verified against Claude Code 2.1.220 running inside tmux 3.6a, 120x40 pane;
# re-verified on 2.1.221 (live rig, 2026-08-06); composer byte shapes
# re-measured on 2.1.222 (F55 ghost probe, 2026-08-13, 140x40 pane);
# composer extraction and clear action re-measured on 2.1.239 (2026-08-21);
# the Fable 5 idle trailer was re-measured on 2.1.243 (2026-08-25).
# On 2.1.221 the idle title is
# "✳ <conversation summary>" and the pre-OSC title is the tmux hostname
# seed; the ^ anchors cover both, do not tighten them to fixed strings.
#
# Sensor summary for this CLI (revised 2026-08-26, findings F72):
#   hooks  the authenticated lifecycle authority. UserPromptSubmit is a
#          candidate start that a visual Working frame promotes to a
#          persistent start on the exact agent generation; SessionStart or any
#          authenticated edge is the process-bound liveness that admits a
#          clean, idle-shaped pane as idle before its first turn. No end hook
#          is declared, so termination is never hook-derived here.
#   screen the only sensor that can confirm idle or end a turn: the
#          completed-turn suffix rule (lifecycle_evidence) is the terminal;
#          the composer rows prove composer state (clean, ghost, typed) but
#          are measured mid-turn and never confirm idle on their own. Modal,
#          permission, and quota states are screen-only too.
#   title  working-tier evidence only (spinner). The idle sparkle stays in
#          the title for a whole turn (MEASURED: 1203 title-idle flaps in six
#          hours on one pane, 25 doorbell writes admitted behind them), so a
#          title never asserts idle over a screen tier that has not confirmed
#          it.

[agent]
id = "claude"
display_name = "Claude Code"
version_tested = "2.1.221"
process_names = ["claude"]
# MEASURED (m1 soak): on native installs ~/.local/bin/claude is a symlink to
# ~/.local/share/claude/versions/2.1.220 and macOS derives the process comm
# from the resolved file, so #{pane_current_command} reports the bare version
# string "2.1.220". process_names alone never binds those panes; the daemon
# falls back to matching argv[0] basenames. It reads that argv from the pane's
# FOREGROUND process group, not #{pane_pid}: a claude started by typing its
# name at a shell prompt is a child of the pane's first process, so pane_pid
# resolves to the shell ("-zsh") and binds nothing.
argv_basenames = ["claude"]
# What `cyclops start --agents claude` runs in a pane. The bare CLI; the
# pane's own hook config is appended at start time from [hooks].settings_flag
# below, so a pane started this way is already reporting.
launch = "claude"

[messaging]
mailbox_capability_file = "~/.claude/skills/cyclops/SKILL.md"

[hooks]
# Configured via --settings <file>; the file may be generated per pane so the
# user's own ~/.claude/settings.json is never modified. MEASURED: hooks fire in
# both interactive TUI and -p print mode.
config_mechanism = "--settings <file>"
# The machine-readable half of config_mechanism above. Its presence is what
# lets `cyclops start --agents claude` hand the pane a hook config at launch
# instead of leaving the operator to wire one by hand. Nothing under
# ~/.claude is read or written to do it.
settings_flag = "--settings"
# The current Claude hook schema exposes no turn id shared by
# UserPromptSubmit and Stop. UserPromptSubmit carries the exact prompt, but
# sibling hooks run concurrently and can still reject it. Treat the event as
# an unkeyed candidate start and dispatch ACK. Visual evidence accepts and
# ends the candidate. A session id or arrival order is not a turn key.
turn_start = "UserPromptSubmit"
turn_start_evidence = "candidate"
ack = "UserPromptSubmit"
ack_evidence = "dispatch"
attention = "Notification"
available = [
  "SessionStart", "SessionEnd", "UserPromptSubmit", "Stop", "StopFailure",
  "PreToolUse", "PostToolUse", "PermissionRequest", "PermissionDenied", "Notification",
]
ack_payload_field = "prompt"      # MEASURED: full injected text present, 130/130 matches
ack_latency_ms_p50 = 21.0
ack_latency_ms_p95 = 26.1

# ---------------------------------------------------------------------------
# Title rules. tmux tracks the OSC title, so #{pane_title} is readable from the
# control connection with no screen scraping at all.
# ---------------------------------------------------------------------------

[[rule]]
id = "title_working_spinner"
state = "working"
priority = 1100
region = "pane_title"
# Braille spinner frames observed: U+2802, U+2810. Range covers the full cycle.
regex = ['^[\x{2800}-\x{28FF}]']
evidence = "MEASURED claude_busy_titles.json; spinner appears 10 ms after UserPromptSubmit"

[[rule]]
id = "title_idle_sparkle"
state = "idle"
priority = 1000
region = "pane_title"
# U+2733 replaces the spinner when the turn ends.
regex = ['^\x{2733}']
evidence = "MEASURED: appears 30-80 ms after the Stop hook, 6 of 6 turns"

# ---------------------------------------------------------------------------
# Screen rules. Only for what the title cannot express.
# ---------------------------------------------------------------------------

[[rule]]
id = "composer_empty"
state = "idle"
composer_semantic = "clean"
priority = 900
# MEASURED mid-turn: the bare prompt row stays on screen during a turn, so
# this row carries the clean composer semantic but never confirms idle or
# ends a turn on its own.
lifecycle_evidence = false
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*❯\s*$']
note = """On 2.1.221 the empty composer stays visible below streaming output,
so this rule matches mid-turn and its idle verdict is trustworthy only under
a live title tier: title_working_spinner (1100) outranking it is what keeps
the fused verdict right while the model works."""
evidence = "MEASURED claude_idle_composer.txt; matches mid-turn on 2.1.221"

# The active-turn status row. MEASURED live on 2.1.236: while a tool task
# runs, Claude keeps the idle sparkle in the title AND keeps the composer
# prompt on screen, so title and screen both read idle and a delivery
# could be admitted into a pane mid-generation. The row that separates the
# two states is this one, and only in the escaped capture: an active step
# paints its glyph and gerund in 38;5;215 with a running timer in
# 38;5;246 right after. Completed steps in the transcript render with a
# solid glyph in uniform 38;5;246 or 38;5;231 and never combine the two,
# which is why this is style-bound rather than a text match on the verb:
# finished rows keep their words forever.
[[rule]]
id = "composer_working_spinner_status"
state = "working"
priority = 1150
# MEASURED 2026-08-26 (Claude Code 2.1.246, probe a91f): long tool output
# pushes the active row past ten rows, the gerund can be painted 38;5;222
# with 38;5;215 inserted between the ellipsis and the timer, and multi-word
# statuses exist. The glyph stays 38;5;215; the gerund accepts any SGR.
region = "bottom_non_empty_lines(24)"
line_regex = ['^[·✶✽✳✢✻]\s+\S+…(?:\s+\(.*\))?\s*$']
line_regex_esc = ['^\x1b\[38;5;215m[·✶✽✳✢✻]\x1b\[39m\s+(?:\x1b\[[0-9;:]*m)*[A-Z][^\s…]*…(?:\x1b\[[0-9;:]*m)*\s+(?:\x1b\[[0-9;:]*m)*\(']

# MEASURED 2026-08-26 (Claude Code 2.1.246, probe a91f, sanitized NDJSON
# db34242c…): after every Stop hook round has finished, the transcript's
# current completed row renders in uniform 38;5;246, the composer box
# follows with a clean prompt, and no active 38;5;215 row sits between
# them. While a Stop hook still runs (additionalContext can resume work) an
# active row is painted below the completed row, so the ordered plain
# suffix rejects any later activity-glyph row and the higher-priority
# active rule is the second defense. This is the only shipped Claude rule
# that is lifecycle evidence of idle; it requires the escaped capture.
[[rule]]
id = "composer_completed_terminal_suffix_2_1_246"
state = "idle"
composer_semantic = "clean"
lifecycle_evidence = true
active_start_terminal = true
priority = 1148
region = "bottom_non_empty_lines(24)"
regex = ['(?m)^[·✶✽✳✢✻]\s+\S+\s+for\s+\d+[smhd](?:\s+\d+[smhd])*\s+·\s+done\s+\d{1,2}:\d{2}\s+(?:AM|PM)\s*\n(?:[^·✶✽✳✢✻\n][^\n]*\n)*─{32,}\s*\n❯\s*\n─{32,}\s*\n(?:\s{0,4}(?:\S[^·\n]*(?: · [^·\n]+){2,} · \d+K window(?: · \d+K used)?(?:\s+/rc)?|(?:Opus|Sonnet|Haiku) \d+(?:\.\d+)?(?: \([^·\n]*\))? · (?:xhigh|high|medium|low)(?: · [^·\n]+)* · [^·\n]*…)\s*(?:\n\s{0,4}paste again to expand\s*)?(?:\n\s{0,4}(?:⏸|⏵⏵) [^·\n]*\b(?:on|off)\b(?: \([^)]*\))?(?: · .+)?\s*)?|\s{0,4}(?:⏸|⏵⏵) [^·\n]*\b(?:on|off)\b(?: \([^)]*\))?(?: · .+)?\s*)\z']
# One ordered escaped pattern, anchored at the end of the region: the
# uniform-246 completed row, then only rows that do not open with the active
# 38;5;215 color, then the 244 rule, the styled composer, the 244 rule, and
# the trailer. Styling is proven on the same rows, in the same order, as the
# plain suffix above; per-line escaped clauses could not tie them together.
regex_esc = ['(?m)^\x1b\[38;5;246m[·✶✽✳✢✻]\x1b\[39m\s+\x1b\[38;5;246m\S+\s+for\s+\d+[smhd](?:\s+\d+[smhd])*\s+·\s+done\s+\d{1,2}:\d{2}\s+(?:AM|PM)(?:\x1b\[39m)?[ \t]*\n(?:(?:[^\x1b\n][^\n]*|\x1b\[(?:38;5;24[46]|39|0)m[^\n]*)\n)*\x1b\[38;5;244m─{32,}\s*\n(?:\x1b\[(?:38;5;246|39)m)*❯(?:\x{a0}| )*(?:\x1b\[(?:38;5;246|39)m)*\s*\n\x1b\[38;5;244m─{32,}\s*\n[^\n]*(?:\n[^\n]*)?\z']
evidence = "MEASURED live capture on Claude Code 2.1.236 (2026-08-20): styled active frames"
# MEASURED 2026-08-26 (Claude Code 2.1.246, pane %1, captured idle frame in
# shipped_rules.rs claude_2_1_246_terminal_suffix_matches_a_real_long_turn):
# a turn over a minute prints two duration units ("Churned for 5m 11s") and
# the real frame carries two trailer rows below the composer box (the model
# status row, then the permissions row). The single-unit duration and the
# one-row trailer both refused every real completion, so no Claude turn
# ever ended on visual evidence and the pane stayed working until the next
# prompt.
# MEASURED 2026-08-28 (Claude Code 2.1.251, pane %1): the status row now
# appends the `/rc` shortcut after `N K used`. It remains inside the same
# escaped, row-connected terminal suffix and does not broaden the completed
# row or clean-composer proof.
# At 123 columns the final 39m reset can occupy its own terminal row after the
# completed line. Empty-row slicing removes that row before rule evaluation,
# so the escaped suffix accepts the otherwise identical completed row without
# its trailing reset.

[[rule]]
id = "composer_working_spinner_status_no_color"
state = "working"
priority = 1149
region = "bottom_non_empty_lines(10)"
lifecycle_evidence = false
unstyled_only = true
regex = ['(?m)^[·✶✽✳✢✻]\s+\S+…(?:\s+\(\d+[smhd](?:\s+·.*)?\))?\s*\n[^\n]+\n─{32,}\n❯\s*\n─{32,}\n\s{0,4}(?:\S[^·\n]*(?: · [^·\n]+){2,} · \d+K window(?: · \d+K used)?|(?:Opus|Sonnet|Haiku) \d+(?:\.\d+)?(?: \([^·\n]*\))? · (?:xhigh|high|medium|low)(?: · [^·\n]+)* · [^·\n]*…)\s*(?:\n\s{0,4}paste again to expand\s*)?(?:\n\s{0,4}(?:⏸|⏵⏵) [^·\n]*\b(?:on|off)\b(?: · .+| \(.+\))?\s*)?\z']
note = """NO_COLOR removes the style distinction that proves this activity row is live. The full terminal suffix makes the runtime classification conservative and useful, but it cannot confirm or cancel a candidate hook lifecycle."""
evidence = "MEASURED Claude Code 2.1.243 under NO_COLOR (2026-08-24): cycling activity row, auxiliary row, and current composer trailer"

[[rule]]
id = "composer_has_staged_input"
state = "idle_with_input"
composer_semantic = "human_input"
priority = 1050
# The typed-input row is the same mid-turn prompt row: a composer semantic,
# never lifecycle evidence of idle.
lifecycle_evidence = false
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*❯\s+\S']
line_regex_esc = ['\x1b\[39m❯\x{a0}[^\x1b]']
note = """Do not inject: would concatenate with existing text. Includes the
collapsed paste form '❯ [Pasted text #1 +80 lines]'. Priority MUST stay above
title_idle_sparkle: the ✳ title reads idle while a human draft sits in the
composer, and an idle verdict would let the gate paste over the draft and
auto-submit it (M1 review, HIGH). Human live typing always wins (GOALS).

The esc clause is the discriminator the plain capture cannot carry (F55).
The live composer line renders 'ESC[39m' + the glyph + a NO-BREAK space,
and REAL input (typed or the collapsed paste chip) follows that NBSP with
no styling at all. Two look-alikes must not hold delivery: ghost/suggestion
text, which by the product's rendering convention arrives styled (a dim or
colored run right after the NBSP, same convention codex and cursor measure
as ESC[2m), and the submitted-prompt echo in scrollback, which repaints the
glyph with its own colors ('ESC[38;5;239m ESC[48;5;237m ❯ ' + a PLAIN
space) and so never carries the NBSP signature this clause requires. The
plain line_regex stays: delivery's marker-in-composer check reads only the
plain clauses, and both clauses must agree before this rule holds a send."""
evidence = "MEASURED F55 ghost probe 2026-08-13, Claude Code 2.1.222: empty 'ESC[39m❯<NBSP>', typed 'ESC[39m❯<NBSP>fix', chip 'ESC[39m❯<NBSP>[Pasted text #1 +8 lines]', echo 'ESC[38;5;239mESC[48;5;237m❯ ESC[38;5;231mReply…'"

[[rule]]
id = "composer_ghost_suggestion"
state = "idle"
priority = 1040
# Ghost text is painted on the same mid-turn prompt row; an ambiguous frame
# holds an active turn rather than ending it.
lifecycle_evidence = false
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*❯\s+\S']
line_regex_esc = ['❯\x{a0}\x1b\[2m\S']
note = """A suggestion the product painted, not something a human staged.
Matches the DIM convention only (ESC[2m), never "any styling": a typed
slash command renders styled too (ESC[38;5;153m on 2.1.232), and treating
all styling as ghost read a human's half-typed /model as idle and pasted
over it. That is the destructive direction of the F55 fix, so this clause
is deliberately narrow: an unrecognized styling falls through to
composer_styled_input below and HOLDS. A ghost we fail to recognize costs
a delivery that waits; a draft we fail to recognize costs the human's
work. Sits between composer_has_staged_input (1050), which refuses this
line via its esc clause, and composer_styled_input (1035)."""
evidence = "MEASURED F55: real input is unstyled after the NBSP; ghost styling per the F19 codex/cursor probes, not yet captured live on Claude"

[[rule]]
id = "composer_styled_input"
state = "idle_with_input"
composer_semantic = "human_input"
priority = 1035
# The typed-input row is the same mid-turn prompt row: a composer semantic,
# never lifecycle evidence of idle.
lifecycle_evidence = false
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*❯\s+\S']
line_regex_esc = ['\x1b\[39m❯\x{a0}\x1b\[']
note = """Composer content that is styled but not the dim ghost above.
MEASURED on 2.1.232: a typed slash command renders
'ESC[39m❯<NBSP>ESC[38;5;153m/model', which the staged-input clause cannot
see (it requires a non-ESC byte after the NBSP) and the ghost clause must
not claim. Without this rule that screen read idle and the gate pasted
into the human's draft and submitted it.

This is the fail-safe floor for the composer: anything styled that is not
provably a ghost is treated as a human's text and held."""
evidence = "MEASURED 2026-08-20 (issue 16, Claude Code 2.1.232): typed '/model' renders ESC[39m + glyph + NBSP + ESC[38;5;153m, while real ghost styling is dim ESC[2m"

[[rule]]
id = "composer_unstyled_input"
state = "idle_with_input"
composer_semantic = "human_input"
priority = 1030
# The typed-input row is the same mid-turn prompt row: a composer semantic,
# never lifecycle evidence of idle.
lifecycle_evidence = false
region = "bottom_non_empty_lines(10)"
unstyled_only = true
regex = ['(?m)^(?:❯(?: |\x{a0})\S[^\n]*|  \S[^\n]*)(?:\n  [^\n]*)*\n─{32,}\n\s{0,4}(?:\S[^·\n]*(?: · [^·\n]+){2,} · \d+K window(?: · \d+K used)?|(?:Opus|Sonnet|Haiku) \d+(?:\.\d+)?(?: \([^·\n]*\))? · (?:xhigh|high|medium|low)(?: · [^·\n]+)* · [^·\n]*…)\s*(?:\n\s{0,4}paste again to expand\s*)?(?:\n\s{0,4}(?:⏸|⏵⏵) [^·\n]*\b(?:on|off)\b(?: · .+| \(.+\))?\s*)?\z']
note = """Fail-closed input proof when Claude honors NO_COLOR and emits no
SGR. The prompt and physical trailer boundary must both be column zero, so a
payload continuation cannot forge either row. Colored real input and ghost
rules remain higher priority and retain their measured style distinction."""
evidence = "MEASURED Claude Code 2.1.243 under NO_COLOR (2026-08-24): prompt content, column-zero box rule, and model status row"

[[rule]]
id = "screen_working"
state = "working"
priority = 800
region = "bottom_non_empty_lines(8)"
contains = ["esc to interrupt"]
note = """MEASURED on 2.1.221 in an UNFOCUSED tmux pane: this text was absent
for a whole 17s streaming turn (sampled at 0.7s plus full mid-turn grids), so
the title spinner is the only working signal cyclops reads there. Kept for
human-focused panes, where it may still render."""
evidence = "MEASURED claude_busy2_after_enter.txt; absent all turn on 2.1.221 unfocused"

[[rule]]
id = "trust_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(16)"
any = [
  { contains = ["safety check"] },
  { contains = ["trust this folder"] },
]
note = """Folder-trust dialog, observed on 2.1.220: 'Quick safety check: Is this
a project you created or one you trust?' with '1. Yes, I trust this folder /
2. No, exit' and 'Enter to confirm . Esc to cancel'. Escape EXITS the CLI, so
startup_modal's auto-dismiss decline (Escape) would kill the session; this rule
sits above startup_modal so that can never match here. Trust is a human
decision (same policy as codex trust_dialog): park the delivery and alert."""
evidence = "MEASURED m1 soak, tests/raw/m1-soak/claude_launch_modals.log"
auto_dismiss = false

[[rule]]
id = "startup_modal"
state = "blocked_modal"
priority = 1200
region = "bottom_non_empty_lines(16)"
any = [
  { contains = ["Enter to confirm"] },
  { contains = ["Esc to keep"] },
]
note = """UNSAFE TO INJECT. Observed live: a 'Claude in Chrome extension detected'
dialog on first launch swallowed a 4 KB paste entirely (measurements.md M4).
Dismiss with Escape, never a bare Enter. The folder-trust dialog also contains
'Enter to confirm' but there Escape exits the CLI; trust_dialog (priority 1300)
must always outrank this rule."""
evidence = "MEASURED m4_paste.py first run"
decline_keys = ["Escape"]
auto_dismiss = true

[[rule]]
id = "permission_prompt"
state = "blocked_permission"
priority = 1200
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["Do you want to"] },
  { line_regex = ['^\s*❯?\s*1\.\s+(Yes|Allow)'] },
]
note = """No hook fires for the interactive permission prompt: the Notification
and PermissionRequest hooks did NOT fire in the measured run, so this state is
screen-only. This is the concrete gap that keeps the screen sensor mandatory."""
evidence = "MEASURED p0_states.py claude: notification_hook_fired=false, permissionrequest_hook_fired=false"
# A permission decision belongs to the human. Park the delivery and alert.
auto_dismiss = false

[injection]
# MEASURED: 4 KB / 80 lines arrives as one collapsed block, zero premature submits.
method = "load-buffer + paste-buffer -p"
submit = "Enter"
# MEASURED 2026-08-21, Claude Code 2.1.239: one C-c clears the
# whole raw multiline composer and a 92-line collapsed paste chip without
# submitting or exiting. C-e C-u cleared only the final logical line.
clear_keys = ["C-c"]
verify_before_submit = true
verify_pattern = ["<message_id>", "Pasted text"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
# Claude 2.1.243 can queue input during ordinary generation but can interrupt
# active tool flow. Working is therefore not a supported write-safe state.
# MEASURED (fixtures claude_idle_2_1_221.txt, claude_pasted_chip_plain.txt):
# below the composer Claude renders a box rule, a model status row, and
# optional hint/mode rows. None of it is payload, so the terminal sentinel
# may be followed by these and still be the last payload token.
# MEASURED (fixtures claude_typed_composer_esc.txt, claude_pasted_chip_esc.txt):
# the rows below the composer arrive in this order, and each is painted by
# the product, so each carries an SGR prefix a pasted human line never has.
# The two lists are one layout: entry i is row i, plain and escaped.
# The box color varies by Claude palette. Color 116 was measured on 2.1.240
# and color 244 on 2.1.243; the full box-glyph row and trailer position provide
# the structural proof.
# MEASURED 2026-08-22 at 60, 80, 100, and 125 columns: a long status
# row keeps the model and effort fields, then ends one later field with ….
composer_trailer_regex = [
  '^─+$',
  '^\s{0,4}(?:\S[^·]*(?: · [^·]+){2,} · \d+K window(?: · \d+K used)?(?:\s+/rc)?|(?:Opus|Sonnet|Haiku) \d+(?:\.\d+)?(?: \([^·]*\))? · (?:xhigh|high|medium|low)(?: · [^·]+)* · [^·]*…)\s*$',
  '^\s{0,4}paste again to expand\s*$',
  '^\s{0,4}(?:⏸|⏵⏵) [^·]*\b(?:on|off)\b(?: \([^)]*\))?(?: · .+)?\s*$',
]
composer_trailer_regex_esc = [
  '^\x1b\[38;5;\d+m─',
  '^\x1b\[39m\s+\x1b\[38;5;\d+m\S',
  '^\s*\x1b\[38;5;\d+mpaste again to expand',
  '^(?:\x1b\[[0-9;:]*m)*\s+\x1b\[38;5;\d+m(?:⏸|⏵⏵)',
]
# Claude honors NO_COLOR and then paints no SGR at all. The box rule is a
# structural boundary outside Claude's measured prompt and continuation rows,
# so the same plain layout remains terminal evidence in that mode.
unstyled_composer_proof = "structural_trailer"
# The first 2 rows are painted every time; the rest are optional.
composer_trailer_required_prefix = 2
# The collapsed-paste chip, as a whole composer row. MEASURED (fixture
# claude_pasted_chip_esc.txt): the composer glyph, then the chip painted
# in 38;5;6. Matching the row rather than the word "Pasted" is the point:
# a message whose subject contained that word used to verify a paste
# whose sentinel had never arrived.
composer_chip_regex = ['^\s*❯\s+\[Pasted text #\d+( \+\d+ lines)?\]\s*$']
composer_chip_regex_esc = ['\x1b\[39m❯\x{a0}\[Pasted text #\d+( \+\d+ lines)?\]']
# capture-pane -J joins tmux physical wraps. These patterns remove only
# Claude's measured prompt and continuation chrome from the logical rows.
composer_prompt_regex = '^❯(?: |\x{a0})(?P<content>.*)$'
composer_continuation_regex = '^  (?P<content>.*)$'
