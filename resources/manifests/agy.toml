# Cyclops detection manifest: Antigravity CLI (agy)
# Derived from MEASURED evidence: the agy 1.1.6 binary's own embedded hook
# documentation plus live runs in tmux 3.6a. This closes coverage gap 7 of
# defense.md, which had only web documentation for this vendor.
#
# THIS IS THE WEAK MEMBER OF THE FLEET. It breaks the ADR's fleet-wide ACK
# assumption in two independent ways. See [hooks].ack_gap.

[agent]
id = "agy"
display_name = "Antigravity CLI"
version_tested = "1.1.6"
process_names = ["agy"]
default_model_observed = "Gemini 3.6 Flash (High)"
# What `cyclops start --agents agy` runs in a pane. The bare CLI; the ACK
# gap below is a property of this vendor and a pane started here has it too.
launch = "agy"

[hooks]
# From the binary's embedded docs (strings extraction) and confirmed live.
config_mechanism = ".agents/hooks.json in the customization root"
config_shape = "named hooks: { \"<name>\": { \"<Event>\": [...] } }"
available = ["PreToolUse", "PostToolUse", "PreInvocation", "PostInvocation", "Stop"]
turn_start = "PreInvocation"
turn_end = "Stop"
payload_encoding = "camelCase protojson"
payload_common_fields = [
  "conversationId", "workspacePaths", "transcriptPath",
  "artifactDirectoryPath", "modelName",
]

ack_gap = """MEASURED, TWO SEPARATE DEFECTS versus the ADR-001 delivery design.

1. There is NO UserPromptSubmit equivalent. The nearest event is PreInvocation
   ('before the model is called'), which fired 48 ms after Enter, so the timing
   is fine.
2. PreInvocation's payload does NOT contain the prompt text. Observed keys:
   artifactDirectoryPath, conversationId, initialNumSteps, invocationNum,
   modelName, transcriptPath, workspacePaths. There is no field carrying the
   injected message, so the ACK CANNOT be matched to a specific message id from
   the hook payload alone.

Consequence: for agy the hook ACK degrades from 'this exact message arrived' to
'a turn started'. To recover message-level matching the daemon must read the
file at transcriptPath and match the marker there, which is a second, slower,
filesystem-dependent step. Cyclops must not assume payload-matchable ACK across
the fleet."""

no_event_name_field = """Hook payloads carry NO event-name field, unlike Claude
(hook_event_name) and Codex (hook_event_name). A single shared hook script
cannot tell which event invoked it. Every event must be registered with a
distinct command that tags itself, e.g. `hooklog.py <log> --event Stop`.
Discovered when a shared logger recorded every agy event as unknown."""

[[rule]]
id = "title_useless"
state = "unknown"
priority = 0
region = "pane_title"
note = """agy sets the pane title to the HOSTNAME ('mac'), carrying no agent state
at all. Third distinct title behavior in a three-agent fleet: Claude publishes
spinner plus task summary, Codex publishes the project directory name, agy
publishes the hostname. There is no fleet-wide title tier."""
evidence = "MEASURED: title == 'mac' at idle and during turns"

[[rule]]
id = "composer_empty"
state = "idle"
priority = 1000
region = "bottom_non_empty_lines(4)"
line_regex = ['^\s*>\s*$']
note = "Composer is a bare '>' between two horizontal rules."
evidence = "MEASURED agy idle capture"

[[rule]]
id = "composer_has_input"
state = "idle_with_input"
priority = 1050
region = "bottom_non_empty_lines(4)"
line_regex = ['^\s*>\s+\S']
evidence = "MEASURED: injected marker rendered as '> CYCVAL-ACK-AGY-002 ...'"

[[rule]]
id = "screen_working"
state = "working"
priority = 800
region = "bottom_non_empty_lines(10)"
any = [
  { contains = ["▸ Thought for"] },
  { contains = ["esc to"] },
  { contains = ["Thinking"] },
]
note = "Step markers use '●' for completed tool steps and '▸' for reasoning blocks."
evidence = "MEASURED agy mid-turn capture"

[[rule]]
id = "quota_exhausted"
state = "blocked_quota"
priority = 1400
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["Individual quota reached"] },
  { contains = ["upgrade your subscription to increase your limits"] },
]
note = """TERMINAL STATE, NOT A TRANSIENT ONE. Observed live at soak seq 102:
'Individual quota reached. Please upgrade your subscription to increase your
limits. Resets in 135h57m42s.' The reset was 5.7 days out. A coordinator that
treats this as ordinary busy-ness will retry for days. This state must park the
agent and raise an operator alert, not queue behind it. The pane stays alive and
the composer eventually returns, so liveness checks alone do NOT catch it: only
the screen text distinguishes 'quota dead' from 'idle and ready'."""
evidence = "MEASURED validation/raw/soak/agy_quota_exhausted_state.txt"

[[rule]]
id = "feedback_survey"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(10)"
contains = ["How's the CLI experience so far"]
note = """Vendor satisfaction survey rendered inline as a numbered choice:
'[1] Good  [2] Fine  [3] Bad  [0] Skip'. A blind delivery pipeline pressing Enter
or a digit would submit telemetry on the operator's behalf. Same hazard class as
the Codex update dialog (findings.md F3): a modal whose default action has an
external side effect. Decline explicitly with '0' (Skip)."""
evidence = "MEASURED, appeared immediately after the quota error at soak seq 102"
decline_keys = ["0"]
auto_dismiss = true

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
verify_pattern = ["<message_id>"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "idle_with_input"]
first_paste_caveat = """MEASURED: the first paste after TUI startup did not stage
(staged_in_composer=false) while the second did. Composer readiness lags the
first rendered prompt glyph. Verify-before-submit catches this; a blind
paste-then-Enter would have lost the message silently."""

[context_leak]
note = """agy auto-read ~/projects/COORDINATION.md and ~/projects/NOTES.md on the
very first turn in a scratch directory, i.e. it walks up beyond the working
directory for context files. Worth knowing before running agents in scratch
dirs under a shared parent."""
evidence = "MEASURED p0_ack_agy round 2 transcript"
