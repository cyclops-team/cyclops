name: release evidence

on:
  # workflow_dispatch is registered only after this file reaches the default
  # branch. Until then, pushing the exact beta integration commit to this
  # disposable branch exercises the same release evidence without publishing.
  push:
    branches: [beta/test/release-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  clean-validation:
    name: release clean-checkout validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - name: Full repository gate
        run: ./scripts/check.sh

  historical-journals:
    name: release historical-journal compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Strict, lenient, and daemon replay contracts
        run: |
          cargo test -p cyclops-ledger --all-targets --no-fail-fast
          cargo test -p cyclopsd --test messaging m2_history:: --no-fail-fast
          cargo test -p cyclopsd --test delivery --no-fail-fast

  installer-and-journeys:
    name: release installer and user journeys (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - name: Installer lifecycle and real user journeys
        run: ./tests/e2e/parity-check.sh --with-installer

  performance:
    name: release performance comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build real binaries used by workspace performance contracts
        run: cargo build -p cyclops -p cyclopsd --bins
      - name: Run stable workloads with environment metadata
        run: python3 scripts/ci-performance.py artifacts/performance.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/performance.json
          if-no-files-found: error
          retention-days: 90

  # A release candidate must prove the upstream adapter against the same SHA.
  # A prior scheduled success cannot stand in for this candidate-wide result.
  tmux-head:
    name: release tmux HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Build tmux from master
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev ncurses-dev build-essential bison pkg-config autoconf automake
          git clone --depth 1 https://github.com/tmux/tmux.git /tmp/tmux-head
          cd /tmp/tmux-head && sh autogen.sh && ./configure && make -j
          sudo make install
          tmux -V
      - name: Full correctness evidence against tmux HEAD
        run: ./scripts/check.sh --fast

  # This is deliberately repeated only for a release candidate. The bounded
  # loop owns race, exact cleanup, soak, and long-history evidence together.
  reliability:
    name: release race and long-history evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Repeated race, forced-cleanup, soak, and long-history evidence
        env:
          CYCLOPS_CI_REPEAT: 10
        run: ./scripts/ci-reliability.sh

  beta-release-gate:
    name: beta release evidence complete
    if: ${{ always() }}
    needs:
      - clean-validation
      - historical-journals
      - installer-and-journeys
      - performance
      - tmux-head
      - reliability
    runs-on: ubuntu-latest
    steps:
      - name: Require every release responsibility
        env:
          CLEAN: ${{ needs.clean-validation.result }}
          JOURNALS: ${{ needs.historical-journals.result }}
          JOURNEYS: ${{ needs.installer-and-journeys.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          TMUX_HEAD: ${{ needs.tmux-head.result }}
          RELIABILITY: ${{ needs.reliability.result }}
        run: |
          test "$CLEAN" = success
          test "$JOURNALS" = success
          test "$JOURNEYS" = success
          test "$PERFORMANCE" = success
          test "$TMUX_HEAD" = success
          test "$RELIABILITY" = success
          echo "Release evidence is complete. This workflow does not publish or merge anything."
