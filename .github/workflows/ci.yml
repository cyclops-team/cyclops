name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request can only merge its newest revision. Push and manual evidence
# use the unique run id so operator-triggered evidence never cancels another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      docs: ${{ steps.paths.outputs.docs }}
      parity: ${{ steps.paths.outputs.parity }}
      website: ${{ steps.paths.outputs.website }}
      installer: ${{ steps.paths.outputs.installer }}
      tmux: ${{ steps.paths.outputs.tmux }}
      platform: ${{ steps.paths.outputs.platform }}
      tmux_head: ${{ steps.paths.outputs.tmux_head }}
      performance_runner: ${{ steps.paths.outputs.performance_runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prove and apply the path classifier
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci-paths.py --selftest
          python3 scripts/ci-paths.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  # Stable conditional check. The job always exists; unrelated changes get an
  # explicit successful not-applicable result instead of a missing check.
  website:
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: require successful path classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "path classification failed; website applicability is unknown"
          exit 1
      - name: website evidence not applicable
        if: ${{ needs.classify.outputs.website != 'true' }}
        run: echo "website inputs did not change"
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.website == 'true' }}
      - uses: actions/setup-node@v7
        if: ${{ needs.classify.outputs.website == 'true' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: ${{ needs.classify.outputs.website == 'true' }}
        run: cmp scripts/install.sh website/static/install.sh
      - if: ${{ needs.classify.outputs.website == 'true' }}
        working-directory: website
        run: npm ci
      - if: ${{ needs.classify.outputs.website == 'true' }}
        working-directory: website
        run: npm run check
      - if: ${{ needs.classify.outputs.website == 'true' }}
        working-directory: website
        run: npm run build

  # Required pull-request correctness. Performance executables have a retained
  # scheduled lane; this job owns static checks, domain/integration tests,
  # documentation compilation, exact-output parity, and focused F24 evidence.
  test-ubuntu:
    name: test (ubuntu-latest)
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: require successful path classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "path classification failed; required evidence applicability is unknown"
          exit 1
      - name: required evidence not applicable
        if: ${{ needs.classify.outputs.rust != 'true' && needs.classify.outputs.docs != 'true' && needs.classify.outputs.parity != 'true' }}
        run: echo "no Rust, documentation, or exact-output input changed"
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.rust == 'true' || needs.classify.outputs.docs == 'true' || needs.classify.outputs.parity == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.classify.outputs.rust == 'true' || needs.classify.outputs.parity == 'true' }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.classify.outputs.rust == 'true' || needs.classify.outputs.parity == 'true' }}
      - uses: taiki-e/install-action@v2
        if: ${{ needs.classify.outputs.rust == 'true' }}
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        if: ${{ needs.classify.outputs.rust == 'true' || needs.classify.outputs.parity == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: formatting
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: cargo fmt --all --check
      - name: release evidence topology
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: python3 scripts/ci-release-evidence.py --selftest
      - name: retained performance artifact contract
        if: ${{ needs.classify.outputs.performance_runner == 'true' }}
        run: python3 scripts/ci-performance.py --selftest
      - name: linting and compilation
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: headless build boundary and command contracts
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: ./scripts/check-headless.sh
      - name: Rust correctness tests
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: |
          status=0
          # workspace_cli's real-daemon start assertion needs its sibling.
          # workspace_boot_sizing does not require a daemon and tolerates
          # daemon-start failure.
          cargo build -p cyclops -p cyclopsd --bins || status=$?
          cargo nextest run --workspace \
            -E 'not (package(cyclopsd) | binary_id(=cyclops-ui::perf) | binary_id(=cyclops-ui::queue_perf) | binary_id(=cyclops-workspace::perf_contract))' \
            --no-fail-fast || status=$?
          cargo test -p cyclopsd --all-targets --no-fail-fast -- --test-threads=4 || status=$?
          exit "$status"
      - name: Rust documentation compiles
        if: ${{ needs.classify.outputs.rust == 'true' }}
        run: cargo doc --workspace --no-deps
      - name: docs point at files that exist
        if: ${{ !cancelled() && needs.classify.outputs.docs == 'true' }}
        run: |
          python3 scripts/check-doc-paths.py --selftest
          python3 scripts/check-doc-paths.py
      - name: messaging documentation agrees
        if: ${{ !cancelled() && needs.classify.outputs.docs == 'true' }}
        run: ./tests/e2e/messaging-docs-parity.sh
      - name: docs and binaries agree
        if: ${{ !cancelled() && needs.classify.outputs.parity == 'true' }}
        run: ./tests/e2e/parity-check.sh
      - name: tests with the scratch root relocated
        if: ${{ !cancelled() && needs.classify.outputs.rust == 'true' }}
        env:
          CYCLOPS_TEST_TMP: /tmp/cyc-relocated
        run: ./scripts/test-relocated-scratch.sh

  # Stable conditional portability check. A full two-platform matrix runs on
  # schedule; PRs pay for macOS only when named platform or tmux risks change.
  test-macos:
    name: test (macos-latest)
    needs: classify
    if: ${{ !cancelled() }}
    # Preserve the stable check name while keeping a not-applicable result off
    # the scarcer macOS pool. Substantive platform evidence still runs there.
    runs-on: ${{ (needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: require successful path classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "path classification failed; macOS applicability is unknown"
          exit 1
      - name: macOS evidence not applicable
        if: ${{ needs.classify.outputs.platform != 'true' && needs.classify.outputs.tmux != 'true' }}
        run: echo "no named macOS portability or tmux risk changed"
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
      - uses: taiki-e/install-action@v2
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
        run: brew install tmux
      - name: macOS correctness and portability
        if: ${{ needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true' }}
        run: |
          status=0
          # workspace_cli's real-daemon start assertion needs its sibling.
          # workspace_boot_sizing does not require a daemon and tolerates
          # daemon-start failure.
          cargo build -p cyclops -p cyclopsd --bins || status=$?
          cargo nextest run --workspace \
            -E 'not (package(cyclopsd) | binary_id(=cyclops-ui::perf) | binary_id(=cyclops-ui::queue_perf) | binary_id(=cyclops-workspace::perf_contract))' \
            --no-fail-fast || status=$?
          cargo test -p cyclopsd --all-targets --no-fail-fast -- --test-threads=4 || status=$?
          exit "$status"
      - name: tests with the scratch root relocated
        if: ${{ !cancelled() && (needs.classify.outputs.platform == 'true' || needs.classify.outputs.tmux == 'true') }}
        env:
          CYCLOPS_TEST_TMP: /private/var/tmp/cyc-relocated
        run: ./scripts/test-relocated-scratch.sh

  # Stable conditional installer checks. Both platforms still prove their
  # distinct profile and userland behavior when installer-owned inputs move.
  installer:
    needs: classify
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Matrix names remain stable. Not-applicable checks use a cheap Linux
    # runner; installer changes still exercise both named operating systems.
    runs-on: ${{ needs.classify.outputs.installer == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - name: require successful path classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "path classification failed; installer applicability is unknown"
          exit 1
      - name: installer evidence not applicable
        if: ${{ needs.classify.outputs.installer != 'true' }}
        run: echo "installer, packaged assets, and installation docs did not change"
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.installer == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.classify.outputs.installer == 'true' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.classify.outputs.installer == 'true' }}
      - name: Install tmux
        if: ${{ needs.classify.outputs.installer == 'true' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - if: ${{ needs.classify.outputs.installer == 'true' }}
        run: ./tests/e2e/parity-check.sh --installer-only

  # Stable advisory tmux-HEAD check. PRs run a focused adapter contract only
  # when adapter or manifest inputs move. Nightly owns the complete HEAD suite.
  tmux-head:
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: require successful path classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "path classification failed; tmux HEAD applicability is unknown"
          exit 1
      - name: tmux HEAD evidence not applicable
        if: ${{ needs.classify.outputs.tmux_head != 'true' }}
        run: echo "tmux adapter, rig, manifests, and layouts did not change"
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.tmux_head == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.classify.outputs.tmux_head == 'true' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.classify.outputs.tmux_head == 'true' }}
      - uses: taiki-e/install-action@v2
        if: ${{ needs.classify.outputs.tmux_head == 'true' }}
        with:
          tool: cargo-nextest@0.9.100
      - name: Build tmux from master
        id: build_tmux_head
        if: ${{ needs.classify.outputs.tmux_head == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev ncurses-dev build-essential bison pkg-config autoconf automake
          git clone --depth 1 https://github.com/tmux/tmux.git /tmp/tmux-head
          cd /tmp/tmux-head && sh autogen.sh && ./configure && make -j
          sudo make install
          tmux -V
      - name: Focused adapter evidence against tmux HEAD
        if: ${{ needs.classify.outputs.tmux_head == 'true' && steps.build_tmux_head.outcome == 'success' }}
        run: |
          cargo build -p cyclops -p cyclopsd --bins
          cargo nextest run -p cyclops-tmux -p cyclops-workspace --no-fail-fast
          cargo test -p cyclopsd --test boot_and_sessions m0::m0_shadow_daemon_end_to_end -- --exact
      - name: tmux HEAD evidence unavailable
        if: ${{ !cancelled() && needs.classify.outputs.tmux_head == 'true' && steps.build_tmux_head.outcome != 'success' }}
        run: echo "tmux HEAD did not build; no fallback tmux evidence was reported"
