name: ci

on:
  push:
    branches: [v2, v3, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: cmp scripts/install.sh website/static/install.sh
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run check
      - working-directory: website
        run: npm run build

  test:
    strategy:
      # One platform failing must not cancel the other. Cyclops has real
      # per-OS behavior (peer credentials, scratch paths), so a Linux
      # failure that hides the macOS result costs a whole round trip.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast keeps scheduling after a failure so one run reports
      # every failing test instead of hiding the remaining failures. The
      # doctests run even when nextest failed, for the same reason; the
      # step fails if either did.
      - name: Rust tests
        run: |
          status=0
          cargo nextest run --workspace -E 'not package(cyclopsd)' --no-fail-fast || status=$?
          cargo test -p cyclopsd --all-targets --no-fail-fast || status=$?
          cargo test --workspace --doc || status=$?
          exit "$status"
      # A path in a doc is checkable. Before this, ARCHITECTURE.md pointed
      # newcomers at files that were not in the repo, and thirty-one source
      # paths were missing their source-directory prefix. --selftest first, so a
      # green result cannot mean the checker stopped checking.
      - name: docs point at files that exist
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check-doc-paths.py --selftest
          python3 scripts/check-doc-paths.py
      # Docs are part of done, so a doc quoting output the binaries no
      # longer print fails the build. This walks the README ladder against
      # a throwaway tmux server and asserts every shape the pages promise.
      # Reuses the debug binaries the tests above built.
      - name: docs and binaries agree
        if: ${{ !cancelled() }}
        run: ./tests/e2e/parity-check.sh
      # F24: every scratch path comes from cyclops_proto::scratch, so the
      # whole suite has to run with that root relocated or the rule can rot
      # unnoticed. The binaries are already built; this is a second test
      # execution, not a second build. On macOS the relocated root is the
      # code path Linux takes, which is the case that broke CI twice.
      - name: tests with the scratch root relocated
        if: ${{ !cancelled() }}
        env:
          CYCLOPS_TEST_TMP: ${{ runner.os == 'macOS' && '/private/var/tmp/cyc-relocated' || '/tmp/cyc-relocated' }}
        run: |
          mkdir -p "$CYCLOPS_TEST_TMP"
          status=0
          cargo nextest run --workspace -E 'not package(cyclopsd)' --no-fail-fast || status=$?
          cargo test -p cyclopsd --all-targets --no-fail-fast || status=$?
          cargo test --workspace --doc || status=$?
          exit "$status"

  # The installer is what a stranger runs first, so it gets its own gate:
  # build, place the binaries, edit a shell profile, set the home up, then
  # uninstall and prove the profile came back byte for byte. Its own job
  # because it does a cold release build, and behind `test` that would sit
  # in front of every test result.
  #
  # Both platforms: the profile it picks and the tools it edits with differ
  # (.bash_profile vs .bashrc, BSD vs GNU userland).
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
      - run: ./tests/e2e/parity-check.sh --installer-only

  # ADR-001 owns the tmux-churn risk by testing the adapter against tmux HEAD.
  # Failures here are early warning, not merge blockers.
  tmux-head:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Build tmux from master
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev ncurses-dev build-essential bison pkg-config autoconf automake
          git clone --depth 1 https://github.com/tmux/tmux.git /tmp/tmux-head
          cd /tmp/tmux-head && sh autogen.sh && ./configure && make -j
          sudo make install
          tmux -V
      # Both halves of the Rust gate, same as the test job: the doctests
      # run even when nextest failed, and the step fails if either did.
      - name: Rust tests against tmux HEAD
        run: |
          status=0
          cargo nextest run --workspace -E 'not package(cyclopsd)' --no-fail-fast || status=$?
          cargo test -p cyclopsd --all-targets --no-fail-fast || status=$?
          cargo test --workspace --doc || status=$?
          exit "$status"
