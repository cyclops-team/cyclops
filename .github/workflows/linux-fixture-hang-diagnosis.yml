name: Linux fixture cleanup diagnosis

# This is a one-shot diagnostic aid for PR #174's Ubuntu-only hang. It runs
# only after an explicit push of its dedicated diagnostic branch, never for a
# pull request, and its scope check refuses fixture changes.
on:
  push:
    branches: [beta/ci/linux-fixture-hang-diagnosis]

permissions:
  contents: read

concurrency:
  group: linux-fixture-hang-diagnosis-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # Each diagnostic run owns short paths. The captured filesystem
  # state therefore identifies only this runner's tmux sockets and scratch.
  CYCLOPS_TEST_TMP: /tmp/cyc-fixture-${{ github.run_id }}-${{ github.run_attempt }}
  TMUX_TMPDIR: /tmp/cyc-tmux-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  diagnose:
    name: diagnose Linux fixture cleanup hang
    runs-on: ubuntu-latest
    # Three independently bounded stages can consume 24m45s. Keep enough
    # runner time for setup, snapshots, and artifact upload after a timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm this is only the PR #174 diagnostic wrapper
        env:
          FIXTURE_REVISION: e4315d3baf414b28a8703f7290dc2f56ccb67135
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FIXTURE_REVISION" HEAD
          actual_paths="$(git diff --name-only "$FIXTURE_REVISION"..HEAD)"
          expected_path=.github/workflows/linux-fixture-hang-diagnosis.yml
          if [ "$actual_paths" != "$expected_path" ]; then
            echo "This workflow must remain a wrapper around PR #174."
            echo "Unexpected paths after $FIXTURE_REVISION:"
            printf '%s\n' "$actual_paths"
            exit 2
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run separately bounded correctness stages
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/cyclops-fixture-hang-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # The normal Ubuntu correctness step completed in five minutes on
          # the immediately preceding green revision. Eight minutes per stage
          # is a diagnostic ceiling for cold-cache variance, not a test wait.
          readonly OUTER_TIMEOUT=8m
          # Preserve a live process tree before `timeout` sends its signal.
          # Ten seconds leaves enough room to name the stage and write a small
          # local snapshot without extending the stage's eight-minute ceiling.
          readonly PRE_TIMEOUT_SNAPSHOT_SECONDS=470
          mkdir -p "$DIAGNOSTIC_DIR" "$CYCLOPS_TEST_TMP" "$TMUX_TMPDIR"

          {
            echo "fixture revision: e4315d3baf414b28a8703f7290dc2f56ccb67135"
            echo "checked-out revision: $(git rev-parse HEAD)"
            echo "tmux: $(tmux -V)"
            echo "nextest: $(cargo nextest --version)"
            echo "CYCLOPS_TEST_TMP=$CYCLOPS_TEST_TMP"
            echo "TMUX_TMPDIR=$TMUX_TMPDIR"
          } > "$DIAGNOSTIC_DIR/environment.txt"

          capture_snapshot() {
            local stage_name=$1
            {
              echo "stage: $stage_name"
              date --utc --iso-8601=seconds
              echo
              echo "process tree (PID PPID PGID SID STAT ELAPSED COMMAND)"
              ps -eo pid,ppid,pgid,sid,stat,etime,args --forest || true
              echo
              echo "pstree"
              if command -v pstree >/dev/null; then
                pstree -ap || true
              else
                echo "pstree is unavailable on this runner"
              fi
              echo
              echo "tmux socket tree: $TMUX_TMPDIR"
              find "$TMUX_TMPDIR" -maxdepth 4 -ls | sort || true
              echo
              echo "Cyclops scratch tree: $CYCLOPS_TEST_TMP"
              find "$CYCLOPS_TEST_TMP" -maxdepth 4 -ls | sort || true
            } > "$DIAGNOSTIC_DIR/${stage_name}-snapshot.txt" 2>&1
          }

          # Sleep inside one Python process so cancelling a successful stage
          # cannot orphan a shell-owned `sleep`. Once the marker exists, the
          # caller waits for this snapshot instead of interrupting it.
          start_pre_timeout_snapshot() {
            local stage_name=$1
            local marker=$2
            local snapshot="$DIAGNOSTIC_DIR/${stage_name}-before-timeout-snapshot.txt"
            python3 - "$PRE_TIMEOUT_SNAPSHOT_SECONDS" "$marker" "$snapshot" \
              "$TMUX_TMPDIR" "$CYCLOPS_TEST_TMP" <<'PY' &
          import datetime
          import pathlib
          import shutil
          import subprocess
          import sys
          import time

          delay, marker, snapshot, tmux_root, scratch_root = sys.argv[1:]
          time.sleep(int(delay))
          pathlib.Path(marker).write_text("before-timeout snapshot started\n", encoding="utf-8")

          def capture(output, heading, command):
              output.write(f"{heading}\n")
              try:
                  result = subprocess.run(command, text=True, capture_output=True, timeout=20)
                  output.write(result.stdout)
                  output.write(result.stderr)
              except Exception as error:
                  output.write(f"snapshot command failed: {error}\n")
              output.write("\n")

          with pathlib.Path(snapshot).open("w", encoding="utf-8") as output:
              output.write("stage: pre-timeout\n")
              output.write(f"timestamp: {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n\n")
              capture(output, "process tree (PID PPID PGID SID STAT ELAPSED COMMAND)",
                      ["ps", "-eo", "pid,ppid,pgid,sid,stat,etime,args", "--forest"])
              if shutil.which("pstree"):
                  capture(output, "pstree", ["pstree", "-ap"])
              else:
                  output.write("pstree\npstree is unavailable on this runner\n\n")
              capture(output, f"tmux socket tree: {tmux_root}",
                      ["find", tmux_root, "-maxdepth", "4", "-ls"])
              capture(output, f"Cyclops scratch tree: {scratch_root}",
                      ["find", scratch_root, "-maxdepth", "4", "-ls"])
          PY
            PRE_TIMEOUT_SNAPSHOT_PID=$!
          }

          run_stage() {
            local stage_name=$1
            local snapshot_pid
            local stage_code
            local snapshot_started
            shift
            printf '%q ' "$@" > "$DIAGNOSTIC_DIR/${stage_name}-command.txt"
            printf '\n' >> "$DIAGNOSTIC_DIR/${stage_name}-command.txt"
            snapshot_started="$DIAGNOSTIC_DIR/${stage_name}-before-timeout.started"
            rm -f "$snapshot_started"

            # A live snapshot distinguishes an ordinary killable test hang
            # from a cleanup owner that survives the timeout signal. On a
            # successful stage, this sleeping helper is stopped below.
            start_pre_timeout_snapshot "$stage_name" "$snapshot_started"
            snapshot_pid=$PRE_TIMEOUT_SNAPSHOT_PID

            set +e
            # Do not use --foreground: GNU timeout then owns this stage's
            # command group. A cleanup owner that deliberately leaves that
            # group remains visible in the post-timeout snapshot. Redirect
            # directly to the retained log: a surviving child that inherited
            # a pipe must not prevent this shell from taking that snapshot.
            timeout --verbose --signal=TERM --kill-after=15s "$OUTER_TIMEOUT" "$@" \
              > "$DIAGNOSTIC_DIR/${stage_name}.log" 2>&1
            stage_code=$?
            set -e

            {
              echo "stage: $stage_name"
              echo "command exit: $stage_code"
              if [ "$stage_code" = 124 ]; then
                echo "outer timeout reached"
              elif [ "$stage_code" = 137 ]; then
                echo "stage was killed; consult timeout's verbose log"
              fi
            } > "$DIAGNOSTIC_DIR/${stage_name}-result.txt"

            if [ "$stage_code" -ne 0 ]; then
              # Capture the post-stage tree before waiting for the pre-timeout
              # helper. A cleanup owner that escaped the stage group can
              # otherwise exit during that wait and erase the evidence.
              capture_snapshot "${stage_name}-after-timeout-or-failure"
            fi

            if [ -f "$snapshot_started" ]; then
              wait "$snapshot_pid" 2>/dev/null || true
            elif kill -0 "$snapshot_pid" 2>/dev/null; then
              kill "$snapshot_pid" 2>/dev/null || true
              wait "$snapshot_pid" 2>/dev/null || true
            fi

            if [ "$stage_code" -ne 0 ]; then
              return "$stage_code"
            fi
          }

          # Keep the ordinary correctness commands intact, while giving the
          # build, nextest, and cyclopsd stages independent failure evidence.
          status=0
          run_stage build cargo build -p cyclops -p cyclopsd --bins || status=$?
          run_stage nextest cargo nextest run --workspace \
            -E 'not (package(cyclopsd) | binary_id(=cyclops-ui::perf) | binary_id(=cyclops-ui::queue_perf) | binary_id(=cyclops-workspace::perf_contract))' \
            --no-fail-fast || status=$?
          run_stage cyclopsd cargo test -p cyclopsd --all-targets --no-fail-fast -- --test-threads=4 || status=$?
          exit "$status"
      - name: Retain Linux hang diagnostics
        if: ${{ always() }}
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/cyclops-fixture-hang-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-fixture-hang-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_DIR }}
          if-no-files-found: error
          retention-days: 14
