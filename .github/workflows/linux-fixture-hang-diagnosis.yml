name: Linux fixture cleanup diagnosis

# This is a one-shot diagnostic aid for PR #174's Ubuntu-only hang. It runs
# only after an explicit push of its dedicated diagnostic branch, never for a
# pull request, and its scope check refuses fixture changes.
on:
  push:
    branches: [beta/ci/linux-fixture-hang-diagnosis]

permissions:
  contents: read

concurrency:
  group: linux-fixture-hang-diagnosis-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # Each diagnostic run owns short paths. The captured filesystem
  # state therefore identifies only this runner's tmux sockets and scratch.
  CYCLOPS_TEST_TMP: /tmp/cyc-fixture-${{ github.run_id }}-${{ github.run_attempt }}
  TMUX_TMPDIR: /tmp/cyc-tmux-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  diagnose:
    name: diagnose Linux fixture cleanup hang
    runs-on: ubuntu-latest
    # This probe stops after the one group-cancellation regression. Leave
    # room for its synchronous snapshots and artifact upload, not a broad
    # suite that can conceal the first useful failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm this is only the PR #174 diagnostic wrapper
        env:
          FIXTURE_REVISION: e4315d3baf414b28a8703f7290dc2f56ccb67135
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FIXTURE_REVISION" HEAD
          actual_paths="$(git diff --name-only "$FIXTURE_REVISION"..HEAD)"
          expected_path=.github/workflows/linux-fixture-hang-diagnosis.yml
          if [ "$actual_paths" != "$expected_path" ]; then
            echo "This workflow must remain a wrapper around PR #174."
            echo "Unexpected paths after $FIXTURE_REVISION:"
            printf '%s\n' "$actual_paths"
            exit 2
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Capture the group-cancellation regression
        run: |
          set -euo pipefail

          readonly DIAGNOSTIC_DIR="$RUNNER_TEMP/cyclops-fixture-hang-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          readonly STAGE_DIR="$DIAGNOSTIC_DIR/interrupted-owner"
          readonly DEADLINE_SECONDS=300
          mkdir -p "$STAGE_DIR" "$CYCLOPS_TEST_TMP" "$TMUX_TMPDIR"

          {
            echo "fixture revision: e4315d3baf414b28a8703f7290dc2f56ccb67135"
            echo "checked-out revision: $(git rev-parse HEAD)"
            echo "tmux: $(tmux -V)"
            echo "CYCLOPS_TEST_TMP=$CYCLOPS_TEST_TMP"
            echo "TMUX_TMPDIR=$TMUX_TMPDIR"
          } > "$DIAGNOSTIC_DIR/environment.txt"

          stage_is_live() {
            local state
            state="$(ps -o stat= -p "$1" 2>/dev/null | tr -d '[:space:]' || true)"
            [[ -n "$state" && "$state" != Z* ]]
          }

          session_pids() {
            ps -eo pid=,sid= | awk -v session="$stage_sid" '$2 == session { print $1 }'
          }

          process_start_tick() {
            sed -E 's/^[^)]*\) //' "/proc/$1/stat" 2>/dev/null | awk '{ print $20 }' || true
          }

          refresh_stage_scope() {
            local next_scope="$STAGE_DIR/stage.scope.next"
            : > "$next_scope"
            for pid in $(session_pids); do
              start_tick="$(process_start_tick "$pid")"
              if [[ -n "$start_tick" ]]; then
                printf '%s %s\n' "$pid" "$start_tick" >> "$next_scope"
              fi
            done
            mv -f "$next_scope" "$STAGE_DIR/stage.scope"
          }

          signal_recorded_scope() {
            local signal=$1
            local pid expected_start_tick actual_start_tick
            [[ -r "$STAGE_DIR/stage.scope" ]] || return
            while read -r pid expected_start_tick; do
              actual_start_tick="$(process_start_tick "$pid")"
              if [[ -n "$actual_start_tick" && "$actual_start_tick" == "$expected_start_tick" ]]; then
                kill "-$signal" "$pid" 2>/dev/null || true
              fi
            done < "$STAGE_DIR/stage.scope"
          }

          wait_for_file() {
            local path=$1
            local deadline=$((SECONDS + 5))
            while [[ ! -s "$path" ]]; do
              if (( SECONDS >= deadline )); then
                echo "stage did not publish its pid file: $path" >&2
                return 1
              fi
              sleep 1
            done
          }

          wait_for_session_to_stop() {
            local seconds=$1
            local deadline=$((SECONDS + seconds))
            while [[ -n "$(session_pids)" ]]; do
              if (( SECONDS >= deadline )); then
                return 1
              fi
              sleep 1
            done
          }

          capture_command() {
            local heading=$1
            local remaining
            shift
            remaining=$((snapshot_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "$heading"
              echo "snapshot deadline reached; command skipped"
              echo
              return
            fi
            echo "$heading"
            python3 - "$remaining" "$@" <<'PY'
          import subprocess
          import sys

          timeout = max(1, min(10, int(sys.argv[1])))
          try:
              result = subprocess.run(
                  sys.argv[2:],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              sys.stdout.write(result.stdout)
              print(f"exit: {result.returncode}")
          except subprocess.TimeoutExpired as error:
              print(f"snapshot command timed out: {error}")
          except Exception as error:
              print(f"snapshot command failed: {error}")
          PY
            echo
          }

          capture_snapshot() {
            local label=$1 scoped=0
            local max_scoped_pids=8
            snapshot_deadline=$((SECONDS + 60))
            {
              echo "snapshot: $label"
              date --utc --iso-8601=seconds
              echo "stage pid=$stage_pid pgid=$stage_pgid sid=$stage_sid"
              echo
              capture_command "process tree (PID PPID PGID SID STAT WCHAN ELAPSED COMMAND)" \
                ps -eo pid,ppid,pgid,sid,stat,wchan:32,etime,args --forest
              capture_command "pstree" pstree -ap
              echo "stage-session process state and descriptors"
              for pid in $(session_pids); do
                if (( scoped >= max_scoped_pids || SECONDS >= snapshot_deadline )); then
                  echo "remaining stage-session processes omitted by the snapshot bound"
                  break
                fi
                scoped=$((scoped + 1))
                echo "--- pid $pid ---"
                capture_command "status" cat "/proc/$pid/status"
                capture_command "cgroup" cat "/proc/$pid/cgroup"
                capture_command "descriptors" ls -la "/proc/$pid/fd"
              done
              capture_command "Unix sockets under this tmux root" \
                grep -F "$TMUX_TMPDIR" /proc/net/unix
              capture_command "tmux socket tree: $TMUX_TMPDIR" \
                find "$TMUX_TMPDIR" -maxdepth 4 -ls
              capture_command "Cyclops scratch tree: $CYCLOPS_TEST_TMP" \
                find "$CYCLOPS_TEST_TMP" -maxdepth 4 -ls
            } > "$STAGE_DIR/$label.txt" 2>&1
          }

          # The test gets a distinct session. Its cleanup owner deliberately
          # creates a new process group but remains in this session, so the
          # supervisor can snapshot it without signalling the GitHub runner.
          setsid bash -c '
            start_tick="$(sed -E "s/^[^)]*\) //" "/proc/$$/stat" | awk "{ print \$20 }")"
            printf "%s %s %s %s\n" "$$" "$(ps -o pgid= -p "$$")" "$(ps -o sid= -p "$$")" "$start_tick" > "$1/pid"
            stage_dir=$1
            shift
            set +e
            "$@"
            status=$?
            printf "%s\n" "$status" > "$stage_dir/exit-status"
            exit "$status"
          ' bash "$STAGE_DIR" \
            cargo test -p cyclops-testrig --test interrupted_owner \
              killing_a_fixture_process_group_removes_only_its_exact_tmux_resources \
              -- --exact --nocapture --test-threads=1 \
            > "$STAGE_DIR/stage.log" 2>&1 &
          launcher=$!

          wait_for_file "$STAGE_DIR/pid"
          read -r stage_pid stage_pgid stage_sid stage_start_tick < "$STAGE_DIR/pid"
          stage_isolation_ready=0
          for value in "$stage_pid" "$stage_pgid" "$stage_sid" "$stage_start_tick"; do
            case "$value" in
              ''|*[!0-9]*)
                echo "invalid isolated stage identity: $stage_pid $stage_pgid $stage_sid" >&2
                exit 2
                ;;
            esac
          done
          if (( stage_pid <= 1 || stage_pgid <= 1 || stage_sid <= 1 )); then
            echo "refusing to signal an implausible stage identity: $stage_pid $stage_pgid $stage_sid" >&2
            exit 2
          fi

          supervisor_sid="$(ps -o sid= -p "$$" | tr -d '[:space:]')"
          case "$supervisor_sid" in
            ''|*[!0-9]*)
              echo "could not identify the supervisor session" >&2
              exit 2
              ;;
          esac
          verify_stage_isolation() {
            local live_pid='' live_pgid='' live_sid='' live_start_tick=''
            read -r live_pid live_pgid live_sid < <(
              ps -o pid=,pgid=,sid= -p "$stage_pid" 2>/dev/null
            )
            live_start_tick="$(process_start_tick "$stage_pid")"
            [[ "$live_pid" == "$stage_pid" ]] &&
              [[ "$live_pgid" == "$stage_pgid" ]] &&
              [[ "$live_sid" == "$stage_sid" ]] &&
              [[ "$live_start_tick" == "$stage_start_tick" ]] &&
              [[ "$stage_pid" == "$stage_pgid" ]] &&
              [[ "$stage_pid" == "$stage_sid" ]] &&
              [[ "$stage_sid" != "$supervisor_sid" ]]
          }

          cleanup_isolated_session() {
            local reason=$1
            if [[ "$stage_isolation_ready" != 1 ]]; then
              if [[ "$reason" != EXIT ]]; then
                trap - EXIT INT TERM
                case "$reason" in
                  INT) exit 130 ;;
                  TERM) exit 143 ;;
                esac
              fi
              return
            fi
            if stage_is_live "$stage_pid" && verify_stage_isolation; then
              refresh_stage_scope
              kill -TERM -- "-$stage_pgid" 2>/dev/null || true
            fi
            wait_for_session_to_stop 3 || true
            signal_recorded_scope KILL
            if [[ "$reason" != EXIT ]]; then
              trap - EXIT INT TERM
              case "$reason" in
                INT) exit 130 ;;
                TERM) exit 143 ;;
              esac
            fi
          }
          if stage_is_live "$stage_pid"; then
            if ! verify_stage_isolation; then
              echo "isolated stage identity changed before cleanup was armed" >&2
              exit 2
            fi
            refresh_stage_scope
            stage_isolation_ready=1
          fi
          trap 'cleanup_isolated_session EXIT' EXIT
          trap 'cleanup_isolated_session INT' INT
          trap 'cleanup_isolated_session TERM' TERM

          deadline=$((SECONDS + DEADLINE_SECONDS))
          while stage_is_live "$stage_pid"; do
            if ! verify_stage_isolation; then
              echo "isolated stage identity changed before a signal" >&2
              exit 2
            fi
            refresh_stage_scope
            if (( SECONDS >= deadline )); then
              refresh_stage_scope
              capture_snapshot before-term
              refresh_stage_scope
              if ! stage_is_live "$stage_pid" || ! verify_stage_isolation; then
                echo "isolated stage identity changed before termination" >&2
                exit 2
              fi
              kill -TERM -- "-$stage_pgid" 2>/dev/null || true
              wait_for_session_to_stop 15 || true
              capture_snapshot after-term

              # The cleanup owner is outside the killed process group but
              # inside the isolated session. Kill only recorded members of
              # that session after preserving the evidence.
              signal_recorded_scope KILL
              wait_for_session_to_stop 3 || true
              capture_snapshot after-kill

              echo "the isolated regression exceeded $DEADLINE_SECONDS seconds" >&2
              exit 124
            fi
            sleep 1
          done

          wait_for_file "$STAGE_DIR/exit-status"
          stage_status="$(cat "$STAGE_DIR/exit-status")"
          case "$stage_status" in
            ''|*[!0-9]*)
              echo "stage wrote an invalid exit status: $stage_status" >&2
              exit 2
              ;;
          esac
          if [[ "$stage_status" -ne 0 ]]; then
            capture_snapshot test-failure
          fi
          exit "$stage_status"

      - name: Retain Linux hang diagnostics
        if: ${{ always() }}
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/cyclops-fixture-hang-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-fixture-hang-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_DIR }}
          if-no-files-found: error
          retention-days: 14
