command = "/opt/cyclops/bin/cyclops hook SessionStart"

[[hooks]]
event = "UserPromptSubmit"
command = "/opt/cyclops/bin/cyclops hook UserPromptSubmit"

[[hooks]]
event = "PreToolUse"
command = "/opt/cyclops/bin/cyclops hook PreToolUse"

