[package]
name = "cyclopsd"
version.workspace = true
edition.workspace = true
description = "The Cyclops daemon: control-mode watcher, sensor fusion, ledger, delivery pipeline, NDJSON socket API."

[dev-dependencies]
# start_paused tests: virtual time for the verify re-read delays.
tokio = { workspace = true, features = ["test-util"] }
# The isolated tmux server, including the unit test inside src/delivery.rs.
cyclops-testrig.workspace = true
# The stream reader, so the restart path can be driven end to end: what
# the daemon writes at boot has to be read by the surface that draws the
# eye, or the two only agree in a hand-written fixture.
cyclops-ui.workspace = true

[dependencies]
cyclops-proto.workspace = true
cyclops-manifest.workspace = true
cyclops-tmux.workspace = true
cyclops-ledger.workspace = true
cyclops-state.workspace = true
# The pane border chrome is painted from the same semantic tokens the CLI
# and the stream paint from, so a theme edit moves all three together.
cyclops-theme.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
clap.workspace = true
libc.workspace = true
unicode-width.workspace = true
