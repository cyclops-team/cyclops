[workspace]
resolver = "2"
members = [
    "crates/cyclops-proto",
    "crates/cyclops-manifest",
    "crates/cyclops-tmux",
    "crates/cyclops-ledger",
    "crates/cyclops-theme",
    "crates/cyclops-ui",
    "crates/cyclopsd",
    "crates/cyclops",
    # Test-only: the isolated tmux server and its teardown rule, in one
    # place because the sites that need it span crates and test kinds.
    "crates/cyclops-testrig",
    "crates/cyclops-workspace",
]

# The production landing page for usecyclops.dev lives at frontend/ as a
# read-only branding reference. It is not part of the Rust workspace.
exclude = ["frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

cyclops-proto = { path = "crates/cyclops-proto" }
cyclops-manifest = { path = "crates/cyclops-manifest" }
cyclops-tmux = { path = "crates/cyclops-tmux" }
cyclops-ledger = { path = "crates/cyclops-ledger" }
cyclops-theme = { path = "crates/cyclops-theme" }
cyclops-ui = { path = "crates/cyclops-ui" }
cyclops-testrig = { path = "crates/cyclops-testrig" }
cyclops-workspace = { path = "crates/cyclops-workspace" }

[profile.release]
lto = "thin"
