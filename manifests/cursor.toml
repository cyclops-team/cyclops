# Cyclops detection manifest: Cursor Agent CLI
# Derived from MEASURED evidence taken 2026-08-05 against cursor-agent
# 2026.07.23-e383d2b inside tmux 3.7b, 120x40 pane. Captures are locked as
# fixtures under crates/cyclops-manifest/tests/fixtures/cursor_*.
#
# Sensor summary for this CLI:
#   title  USELESS for state. #{pane_title} is "Cursor Agent" until the first
#          turn ends and the CHAT TOPIC after it ("Add Function Info"), which
#          tracks the conversation subject, not busy/idle. It is identical
#          while working and while idle. There is no title tier for Cursor.
#   hooks  AUTHORITATIVE for turn edges and the delivery ACK. beforeSubmitPrompt
#          carries the full prompt text, so Cursor earns the verified tier.
#   screen REQUIRED for busy/idle, modals and approvals, since the title
#          carries nothing.

[agent]
id = "cursor"
display_name = "Cursor Agent"
version_tested = "2026.07.23-e383d2b"

# MEASURED, and the reason this manifest binds on argv alone. The installed
# entry points ~/.local/bin/agent and ~/.local/bin/cursor-agent are symlinks
# to versions/<build>/cursor-agent, and that file is a BASH WRAPPER, not the
# program. Its last line is:
#
#     exec -a "$0" "$NODE_BIN" --use-system-ca "$SCRIPT_DIR/index.js" "$@"
#
# so the process that survives is the bundled node, and tmux reports
# #{pane_current_command} = "node". Binding on that would claim every node
# process on the machine, so "node" is deliberately NOT listed here.
#
# The same exec is what makes argv reliable: `exec -a "$0"` sets argv[0] to
# the path the user invoked, so `ps -o args=` reports
# "/Users/<you>/.local/bin/agent ..." and the basename is the invoked name.
# Both entry-point names are listed because the wrapper exports
# CURSOR_INVOKED_AS="$(basename "$0")" and either one is a supported way in.
process_names = ["cursor-agent"]   # does not match this install; here for a
                                   # future build that ships a real binary
argv_basenames = ["agent", "cursor-agent"]

[hooks]
# MEASURED with a logging hook installed at <workspace>/.cursor/hooks.json:
# every event below fired, with the payloads recorded in this file's notes.
# This CONTRADICTS community reports (forum threads through mid-2026) that
# beforeSubmitPrompt, afterAgentResponse and afterAgentThought do not fire in
# the CLI. On this build beforeSubmitPrompt and afterAgentThought both fire.
config_mechanism = "hooks.json in ~/.cursor/ or <workspace>/.cursor/"
turn_start = "beforeSubmitPrompt"
turn_end = "stop"
ack = "beforeSubmitPrompt"        # delivery receipt, payload carries `prompt`
ack_payload_field = "prompt"
available = [
  "sessionStart", "sessionEnd", "beforeSubmitPrompt", "stop", "preToolUse",
  "postToolUse", "postToolUseFailure", "beforeShellExecution",
  "afterShellExecution", "beforeMCPExecution", "afterMCPExecution",
  "beforeReadFile", "afterFileEdit", "afterAgentResponse", "afterAgentThought",
  "preCompact", "subagentStart", "subagentStop",
]

measured_events = """MEASURED, two turns. A no-tool turn ("say hi in one word")
fired sessionStart, beforeSubmitPrompt, afterAgentThought x8, stop. A shell turn
fired beforeSubmitPrompt, preToolUse, beforeShellExecution, afterShellExecution,
postToolUse, afterAgentThought x8. Payload keys common to every event:
conversation_id, generation_id, session_id, hook_event_name, model,
cursor_version, workspace_roots, user_email, transcript_path. beforeSubmitPrompt
adds `prompt` (full text, verified against the submitted string) and
`attachments`. stop adds status, loop_count and the token counters, and its
generation_id equals the beforeSubmitPrompt generation_id for the same turn,
which is the pair a turn is deduped on."""

config_location = """MEASURED DEPLOYMENT FACT. Hooks are read from
~/.cursor/hooks.json and <workspace>/.cursor/hooks.json. CURSOR_CONFIG_DIR
relocates cli-config.json but NOT hooks.json: a hooks.json placed in a
CURSOR_CONFIG_DIR fired zero events across a full session, while the same file
at <workspace>/.cursor/hooks.json fired every event. Do not instruct anyone to
install hooks via CURSOR_CONFIG_DIR."""

# ---------------------------------------------------------------------------
# Screen rules. No title tier exists for this CLI.
#
# PRIORITY ORDER IS LOAD-BEARING AND DIFFERS FROM codex.toml. Cursor keeps a
# dim placeholder in the composer for the WHOLE turn ("Add a follow-up" while
# the agent is working), so the composer rules match continuously. If they
# outranked screen_working the way codex's do, a Cursor pane would read idle
# for the entire turn and a delivery could be pasted mid-generation. Working
# therefore sits ABOVE the composer rules here.
# ---------------------------------------------------------------------------

[[rule]]
id = "trust_dialog"
state = "blocked_modal"
priority = 1300
region = "bottom_non_empty_lines(16)"
contains = ["Do you trust the contents of this directory"]
# The second clause is what makes this rule correct, not just descriptive.
# MEASURED: answering the dialog does NOT clear it from the screen. The text
# "Do you trust the contents of this directory?" is still on the pane long
# after the agent is idle and taking prompts, so a rule matching the question
# alone reports blocked_modal forever and parks every delivery to a healthy
# pane. The '▶' selection marker is present ONLY while the dialog owns the
# keyboard; once answered the line renders as a bare '  [a] Trust this
# workspace'. Both clauses AND, so this fires on the live dialog only.
line_regex = ['▶\s*\[a\]\s+Trust this workspace']
note = """Startup gate: 'Workspace Trust Required / Cursor Agent can execute
code and access files in this directory.' Options are '[a] Trust this
workspace' and '[q] Quit'. Declining QUITS the CLI, the same hazard as
Claude's folder-trust dialog, so this never auto-dismisses. There is also no
flag to pre-answer it: --trust is accepted only in -p/--print mode, not in the
interactive TUI. Trust is a human decision; park the delivery and alert."""
evidence = "MEASURED 2026-08-05, fixtures/cursor_trust_dialog.txt (live) and cursor_ghost_composer_plain.txt (same text, already answered)"
auto_dismiss = false

[[rule]]
id = "approval_prompt"
state = "blocked_permission"
priority = 1200
region = "bottom_non_empty_lines(12)"
any = [
  { contains = ["Waiting for approval..."] },
  { contains = ["Run this command?"] },
  { contains = ["Run this command outside the sandbox?"] },
  { contains = ["Run this MCP tool?"] },
  { contains = ["Allow this web fetch?"] },
  { contains = ["Allow this web search?"] },
]
note = """MEASURED with approvalMode="allowlist" (the default is "unrestricted",
which auto-runs everything and never shows this). The prompt renders as:

    $ ls -la /tmp/curdemo Waiting for approval...
    ---------------------------------------------------------------
     $  ls -la /tmp/curdemo in .
     Run this command?
     Shell allowlist is empty
      → Run (once) (y)
        Add Shell(ls) to allowlist? (tab)
        Run Everything (shift+tab)
        Skip & tell the agent what to do instead (esc or n)

Note the selection marker on 'Run (once)' is the SAME '→' glyph the composer
uses, so on a plain capture the composer rules also match this screen. This
rule outranking them is what keeps an approval from reading as idle_with_input.
The remaining variants come from the shipped bundle's string table
(index.js): 'Allow once' / 'Allow always' are the option labels for the web
and MCP prompts. An approval belongs to the human: park and alert."""
evidence = "MEASURED 2026-08-05, fixtures/cursor_approval_prompt.txt; variant strings from the shipped index.js"
auto_dismiss = false

[[rule]]
id = "screen_working"
state = "working"
priority = 1100
region = "bottom_non_empty_lines(8)"
any = [
  { contains = ["ctrl+c to stop"] },
  { line_regex = ['^\s*[\x{2800}-\x{28FF}]+\s+(?:Working|Thinking|Searching|Running|Generating)\b'] },
]
note = """Two independent working signals, both MEASURED. The primary is the
right-hand hint 'ctrl+c to stop' on the composer line, which is present for
exactly the duration of the turn and gone the moment it ends. The second is the
status line: a braille spinner followed by a status word and a token count,
observed as '⠠⠛ Working', '⠀⠞ Searching  59 tokens', '⠀⠞ Thinking  1.47k
tokens' and '⠀⠞ Running  49 tokens'. The spinner prefix is required by the
regex so that the bare word 'Working' in the agent's own OUTPUT cannot match.
'Reconnecting' is deliberately excluded: it is a transport retry, not a turn.

This rule MUST outrank the composer rules. MEASURED: the composer keeps its dim
placeholder for the whole turn, so composer_ghost_or_empty matches continuously
while the agent is generating."""
evidence = "MEASURED 2026-08-05, fixtures/cursor_working_composer_esc.txt; 'ctrl+c to stop' present in samples 1-6 of a polled turn and absent from sample 7 on"

[[rule]]
id = "composer_typed_input"
state = "idle_with_input"
priority = 1050
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^(?:\s|\x1b\[[0-9;]*m)*→\s+[^\x1b\s]']
note = """Typed or staged text: the '→' glyph is NOT dim and the first
significant byte after it is a plain character rather than an SGR introducer.
Do not inject; this would concatenate with the human's draft. Human live
typing always wins (GOALS)."""
evidence = "MEASURED: ' \\x1b[48;2;21;21;21m → what does add do'"

[[rule]]
id = "composer_ghost_or_empty"
state = "idle"
priority = 1000
region = "bottom_non_empty_lines(6)"
line_regex_esc = ['^(?:\s|\x1b\[[0-9;]*m)*\x1b\[(?:0;)?2m→']
note = """An empty composer renders its placeholder, and the placeholder is
wrapped in SGR dim (ESC[2m) STARTING AT THE GLYPH — the opposite arrangement
from Codex, where the glyph is bold and only the ghost text after it is dim.
The placeholder text itself is not stable and must never be matched: it is
'Plan, search, build anything' before the first turn and 'Add a follow-up'
after it. Matching the dim glyph is what survives that change."""
evidence = "MEASURED: ' \\x1b[48;2;21;21;21m \\x1b[2m→ \\x1b[0;7mP\\x1b[0;2m...lan, search, build anything'"

[[rule]]
id = "composer_plain_fallback"
state = "idle"
priority = 900
region = "bottom_non_empty_lines(6)"
line_regex = ['^\s*→\s']
note = """FALLBACK ONLY, for a capture taken without escapes. The two rules
above are the real answer and the daemon supplies an escaped capture wherever
a bound manifest carries esc rules. On a plain capture the glyph alone cannot
separate a placeholder from typed text, so this reads typed input as idle;
that is the same residual gap documented on codex and it fails toward idle
rather than toward unknown."""
evidence = "MEASURED plain capture: '  → Add a follow-up'"

[injection]
method = "load-buffer + paste-buffer -p"
submit = "Enter"
verify_before_submit = true
# MEASURED, and the reason this list is shorter than Claude's and Codex's:
# Cursor does NOT collapse a multi-line paste into a '[Pasted text #1]'
# summary. A 5-line paste rendered as 5 literal composer lines with the first
# line still on the '→' line, so the message id is directly visible and a
# 'Pasted' sentinel would never match.
verify_pattern = ["<message_id>"]
safe_states = ["idle"]
unsafe_states = ["blocked_modal", "blocked_permission", "idle_with_input"]
# busy_behavior is deliberately absent: what Cursor does with text pasted
# mid-turn was not measured, and safe_states = ["idle"] already gates on it.
