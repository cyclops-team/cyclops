# Nextest configuration for Cyclops tests.
# Keep local and CI execution bounded to the same behavior.

[profile.default]
# The tmux-backed test rigs were designed around an eight-slot process bound.
# Cap the whole nextest run so separate test processes preserve that bound.
test-threads = 8
# When a test runs longer than period, nextest reports a slow test warning.
# After the third period, nextest starts termination and applies its grace
# period. The hung test is named instead of stalling the runner indefinitely.
slow-timeout = { period = "60s", terminate-after = 3 }
retries = 0
fail-fast = false

# Nextest launches every test in its own process. That bypasses the
# workspace performance suite's in-process serial lock and lets its tmux
# floods compete with the UI suites' wall-clock budgets. Give each of these
# tests the whole configured pool so they run alone, one at a time.
[[profile.default.overrides]]
filter = 'binary_id(=cyclops-ui::perf) | binary_id(=cyclops-ui::queue_perf) | binary_id(=cyclops-workspace::perf_contract)'
threads-required = "num-test-threads"
